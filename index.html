<style>
/* TONE MÀU GREEN PANTONE VÀ SUPERELLIPSE */
:root {
  --bg: #f2f7f5;
  --fg: #2b3d36;
  --mut: #688478;
  --card: #ffffff;
  --line: #cddcd6;
  --ac: #34645c; 
  --ac2: #d6e5df; 
  --ac-hover: #264a44;
  --shadow: 0px 8px 24px rgba(52, 100, 92, 0.1);
  --border-radius: 24px; 
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1a231f;--fg:#e6ebe8;--mut:#93a09a;--card:#212e29;--line:#2f4039;--ac:#72b075;--ac2:#263630;--shadow: 0px 5px 20px rgba(0,0,0,0.3);}
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 "Open Sans", system-ui, sans-serif; transition: all 0.3s ease;}
[hidden] { display: none !important; }
button, select, input { font: inherit; color: inherit; transition: 0.3s; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--card); padding: 8px 18px; border-radius: 50px; font-family: "Raleway", sans-serif; font-weight: 600; font-size: 13px; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ac); outline-offset: 1px; }
button:hover { background: var(--line); transform: translateY(-1px); }
button.pri { background: var(--ac); border-color: var(--ac); color: #fff; box-shadow: 0 4px 10px rgba(52, 100, 92, 0.2); }
button.pri:hover { background: var(--ac-hover); border-color: var(--ac-hover); box-shadow: 0 6px 15px rgba(52, 100, 92, 0.3); }
button.on { background: var(--ac); color: #fff; border-color: var(--ac); }
button.on:hover { background: var(--ac-hover); color: #fff;}

input, select { padding: 10px 15px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); width: 100%; font-size: 14px; }
input:focus, select:focus { border-color: var(--ac); background: var(--card); box-shadow: 0 0 5px rgba(52, 100, 92,0.2); outline: none; }

/* App Layout */
header { display: flex; align-items: center; gap: 12px; padding: 15px 30px; border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--card); box-shadow: 0 2px 15px rgba(0,0,0,0.05); }
header h1 { font-size: 22px; margin: 0; flex: 1; font-family: "Raleway", sans-serif; font-weight: 700; color: var(--ac); }
header h1::before { content: ''; display: inline-block; width: 4px; height: 20px; background: var(--ac); margin-right: 10px; vertical-align: middle; border-radius: 2px;}

.data-selector { display: flex; gap: 10px; padding: 15px 30px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; background: var(--ac2); }
.filters { display: flex; gap: 15px; padding: 15px 30px; flex-wrap: wrap; background: var(--card); }
.filters label { display: grid; gap: 5px; min-width: 170px; color: var(--mut); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

/* TABS & SLIDER ANIMATION */
.tabs-outer { display: flex; gap: 8px; padding: 10px 30px 0; border-bottom: 2px solid var(--line); background: var(--card); align-items: center; overflow-x: auto; position: relative; }
.tabs { display: flex; gap: 8px; position: relative; padding: 0; border: none; background: transparent; }
.tabs button { border: none !important; padding: 12px 20px; font-size: 14px; color: var(--mut); background: none; margin-bottom: 0; border-radius: 0; }
.tabs button:hover { color: var(--ac); transform: none; background: none; }
.tabs button.on { color: var(--ac); font-weight: 700; background: none; }
.tab-slider { position: absolute; bottom: 0; left: 0; height: 3px; background-color: var(--ac); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 3px 3px 0 0; }

main { padding: 24px 30px; background: var(--bg); min-height: calc(100vh - 200px); }

/* BẢNG CHUNG & TIÊU ĐỀ CỐ ĐỊNH CÓ MÀU GREEN */
.wrap { overflow-x: auto; overflow-y: auto; max-height: 70vh; border: none; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); }
.wrap table { border-collapse: collapse; width: 100%; white-space: nowrap; font-size: 11px; }
.wrap th, .wrap td { padding: 4px 6px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
.wrap th { background-color: var(--ac2) !important; color: var(--ac) !important; position: sticky; top: 0; z-index: 2; font-family: "Raleway", sans-serif; font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; box-shadow: 0 1px 0 var(--line); }
.wrap tr:hover td { background: #fbfbfc; }
td.n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.neg { color: #d9232d; font-weight: 700; }

/* BẢNG CURRENT INVENTORY - GIỮ LẠI MÀU SẮC RIÊNG CỦA CỘT HSD */
.wrap th.hsd-30 { background-color: #d9232d !important; color: white !important; border:none; }
.wrap th.hsd-50 { background-color: #fd7e14 !important; color: white !important; border:none;}
.wrap th.hsd-60 { background-color: #ffc107 !important; color: #333 !important; border:none;}
.wrap th.hsd-70 { background-color: #28a745 !important; color: white !important; border:none;}
.wrap th.hsd-gt70 { background-color: #20c997 !important; color: white !important; border:none;}
.wrap th.hsd-total { background-color: #343a40 !important; color: white !important; border:none;}
.text-center { text-align: center !important; }

/* Badges */
.b { padding: 4px 10px; border-radius: 50px; font-size: 11px; border: none; display: inline-block; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.ok { color: #155724; background: #d4edda; }
.wt { color: #856404; background: #fff3cd; }
.nr { color: #9c4321; background: #fde5c5; }
.dp { color: #721c24; background: #f8d7da; }
.ex { color: #fff; background: #d9232d; }

.note { color: var(--mut); margin: 0 0 15px; font-size: 13px; }
.empty { padding: 50px; text-align: center; color: var(--mut); font-size: 16px; font-style: italic; }

.acc-btn { padding: 2px 8px; margin-right: 8px; border-radius: 8px; background: var(--ac2); border: none; color: var(--ac); font-family: monospace; font-weight: bold; cursor: pointer; transition: 0.2s; }
.acc-btn:hover { background: var(--ac); color: white; transform: scale(1.1); }

/* Animations */
@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.animated-view { animation: fadeInUp 0.4s ease-out forwards; }


/* ========================================================
   CSS SAU ĐĂNG NHẬP & LAYOUT 65-35 CHO CURRENT INVENTORY
   ======================================================== */
body.logged-in { background: url('assets/img/hero-carousel/hero-carousel-1.png') no-repeat center center fixed !important; background-size: cover !important; }
body.logged-in header { background: transparent !important; border-bottom: 1px solid rgba(255,255,255,0.3) !important; box-shadow: none !important; }
body.logged-in header h1 { color: #fff !important; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }
body.logged-in header button { background: rgba(255,255,255,0.2); color: #fff; border-color: rgba(255,255,255,0.5); }
body.logged-in header button:hover { background: rgba(255,255,255,0.4); }
body.logged-in header button.on { background: var(--ac); color: #fff; border-color: var(--ac); }

body.logged-in .tabs-outer, body.logged-in main { background: var(--bg) !important; overflow-x: hidden; }
.controls-wrapper { display: flex; flex-wrap: wrap; gap: 10px; background: var(--ac2) !important; align-items: center; justify-content: space-between; padding: 10px 20px; border-bottom: 1px solid var(--line); }
.controls-wrapper .data-selector { border: none; padding: 0; background: transparent; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1 1 auto; }
.controls-wrapper .filters { border: none; padding: 0; background: transparent; display: flex; flex-wrap: wrap; gap: 10px; flex: 2 1 auto; justify-content: flex-end; }
.controls-wrapper .filters label { flex: 1 1 90px; max-width: 140px; min-width: 90px; font-size: 11px; gap: 2px; }
.controls-wrapper .filters input, .controls-wrapper .filters select { padding: 4px 6px; font-size: 12px; width: 100%; height: 30px; }

/* FIX CANVAS BLOWOUT & GIỮ LAYOUT 65-35 CHO CURRENT INVENTORY */
.inv-layout { display: flex; flex-wrap: nowrap; gap: 15px; align-items: stretch; width: 100%; height: 65vh; min-width: 0; }
.inv-table-col { flex: 0 0 65%; max-width: 65%; min-width: 0; display: flex; flex-direction: column; height: 100%; }
.inv-chart-col { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
.inv-table-col .wrap { height: 100%; max-height: 100%; overflow-y: auto; } 

.chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; height: 100%; }
.chart-grid.single-chart { grid-template-columns: minmax(0, 1fr); }
.chart-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; min-height: 0; min-width: 0; }
.canvas-container { position: relative; width: 100%; flex: 1; min-height: 0; min-width: 0; }
</style>

    if(btn && slider) {
        slider.style.width = btn.offsetWidth + 'px';
        slider.style.transform = `translateX(${btn.offsetLeft}px)`;
    }
}

/* ============ TIỆN ÍCH ============ */
const $= s => document.querySelector(s),$$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* FORMAT SỐ THEO CHUẨN QUỐC TẾ - THÔNG MINH THEO TAB */
const fmt = (n) => {
    if (n == null) return '—';
    if (tab === 'mt' || tab === 'tt') {
        return Math.round(n).toLocaleString('en-US'); // Số nguyên cho MT, TT
    }
    return (Math.round(n * 10) / 10).toLocaleString('en-US'); // Giữ 1 thập phân cho các tab khác
};

const MN = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
let lang = 'vi', sb = null, DB = null, tab = 'inv'; 

const pick = (r, re) => { 
  if (!r) return undefined;
  const k = Object.keys(r).find(k => re.test(String(k).trim().replace(/\s+/g, ' '))); 
  return k ? r[k] : undefined; 
};

const day = ms => Math.floor(ms / 864e5) * 864e5;
const addMonths = (ms, n) => { const d = new Date(ms); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, d.getUTCDate()); };

function parseExcelDate(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : Date.UTC(v.getUTCFullYear(), v.getUTCMonth(), v.getUTCDate());
  if (typeof v === 'number') return v > 1e10 ? day(v) : day(Math.round((v - 25569) * 864e5));
  
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3]);
  
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) {
    let y = +m[3] < 100 ? 2000 + +m[3] : +m[3];
    if (+m[1] > 12) return Date.UTC(y, +m[2] - 1, +m[1]);
    return Date.UTC(y, +m[1] - 1, +m[2]);
  }
  
  m = s.match(/^(\d{1,2})[\/\-.\s]([a-zA-Z]{3})(?:[\/\-.\s](\d{2,4}))?$/);
  if (m) {
    const monthStr = m[2].toLowerCase(), monthIdx = MN.findIndex(mn => monthStr.startsWith(mn));
    if (monthIdx >= 0) { const yr = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : CURRENT_YEAR; return Date.UTC(yr, monthIdx, +m[1]); }
  }
  const t = Date.parse(s); return isNaN(t) ? null : day(t);
}

const monthOf = ms => new Date(ms).getUTCMonth() + 1;
function parseMonth(v) {
  if (v instanceof Date || (typeof v === 'number' && v > 100)) { const t = parseExcelDate(v); return t ? monthOf(t) : null; }
  const s = String(v ?? '').trim().toLowerCase(), i = MN.findIndex(m => s.startsWith(m));
  return i >= 0 ? i + 1 : (+s.replace(/\D/g, '') || null);
}

function parseDirectShelfLife(v) {
  if (v == null || v === '') return null;
  let num = parseFloat(String(v).replace('%', '').trim());
  if (isNaN(num)) return null;
  if (num > 0 && num <= 1.2 && typeof v === 'number') num *= 100;
  return num;
}

function normLoc(v) {
  const s = String(v ?? '').trim().toLowerCase();
  if (['11001', 'hcmc', 'hcm', 'south', 'miền nam', 'mn', 'ho chi minh', 'hồ chí minh'].includes(s)) return 'South';
  if (['15001', 'hanoi', 'hn', 'north', 'miền bắc', 'mb', 'ha noi', 'hà nội'].includes(s)) return 'North';
  return String(v ?? '').trim();
}

function getLoc(r) {
  let loc = r["Warehouse"] ?? r["Location"] ?? r["HQ"] ?? pick(r, /warehouse|location|kho|vùng|miền|branch|region|loc|hq/i);
  if (!loc || String(loc).trim() === "") {
    const val = Object.values(r).find(v => {
      const s = String(v ?? "").trim().toLowerCase();
      return ["11001", "hcmc", "hcm", "south", "miền nam", "mn", "15001", "hanoi", "hn", "north", "miền bắc", "mb"].includes(s);
    });
    if (val) loc = val;
  }
  return normLoc(loc);
}
const cleanSku = v => String(v ?? '').trim().replace(/-01$/, '');
const skipSku = s => { if (!s) return true; const up = String(s).toUpperCase(); return up.startsWith('CKCT') || up.startsWith('MD') || up.startsWith('QD'); };

/* ============ CHUẨN HÓA DỮ LIỆU THÔ ============ */
function normalize(raw) {
  const master = new Map();
  raw.master.forEach(r => {
    const code = cleanSku(pick(r, /item.*code|sku/i)); if (!code) return;
    master.set(code, {
      name: String(pick(r, /^(tên hh|ten hh|description)/i) ?? '').trim(),
      line: 'Snack', life: +pick(r, /useful life/i) || 0,
      ea: { 1: +pick(r, /^ea qty #1/i) || 1, 2: +pick(r, /^ea qty #2/i) || 1, 3: +pick(r, /^ea qty #3/i) || 1 }
    });
  });

  const skuList = Array.isArray(raw.sku) ? raw.sku : [];
  skuList.forEach(r => {
    const code = cleanSku(pick(r, /item number|sku/i)); if (!code) return;
    const name = String(pick(r, /^(tên|name|desc|product)/i) || Object.values(r)[1] || '').trim();
    if (master.has(code)) { if (name) master.get(code).name = name; } 
    else master.set(code, { name, line: 'Snack', life: 0, ea: {1:1,2:1,3:1} });
  });

  const unitMap = {};
  (raw.unit || []).forEach(r => { unitMap[String(pick(r, /^(unit|đơn vị|mã)/i) ?? Object.values(r)[0]).trim().toUpperCase()] = String(pick(r, /ea qty type/i) ?? ''); });
  const eaLevel = u => { const t = unitMap[u] || ''; return /3|cn|can/i.test(t) ? 3 : /2|pack/i.test(t) ? 2 : 1; };

  const custypeMap = {};
  (raw.custype || []).forEach(r => {
    const keys = Object.keys(r);
    if (keys.length >= 2) {
      const qadType = String(r[keys[0]]).trim().toUpperCase();
      const planCustomer = String(r[keys[1]]).trim();
      if (qadType) { custypeMap[qadType] = planCustomer; }
    }
  });

  const G = new Map();
  const grp = (loc, sku) => {
    const k = loc + '|' + sku;
    if (!G.has(k)) G.set(k, { loc, sku, line: 'Snack', oh: [], tr: [], plan: {}, mtPlan: {}, qad: {}, mtQad: {}, planDetails: [], qadByCus: {}, transactions: [] });
    return G.get(k);
  };
  const life = s => master.get(s)?.life || 0;

  raw.onhand.forEach(r => {
    const sku = cleanSku(r['SKU_Code'] ?? r['SKU Code'] ?? pick(r, /sku/i));
    const loc = getLoc(r);
    const qty = +(r['Q.ty On-Hand'] ?? r['Qty On-Hand'] ?? r['Qty On Hand'] ?? pick(r, /qty|on.*hand|tồn/i)) || 0;
    
    if (skipSku(sku) || !qty) return;
    const g = grp(loc, sku);
    if (!g.fallbackName) g.fallbackName = String(r['Sort Name'] ?? pick(r, /sort.*name|tên/i) ?? '').trim();
    const exp = parseExcelDate(r['Expiry Date'] ?? r['ExpiryDate'] ?? pick(r, /expiry|exp|hsd/i));
    let mnf = parseExcelDate(r['MNF Date'] ?? r['MNFDate'] ?? pick(r, /mnf|mfg|nsx/i));
    let slDirect = parseDirectShelfLife(r['Shelf-life'] ?? r['Shelf life'] ?? pick(r, /shelf.*life/i));

    if (!mnf && exp && life(sku)) mnf = addMonths(exp, -life(sku));
    g.oh.push({ exp, mnf, qty, est: false, slDirect });
  });

  raw.transit.forEach(r => {
    const sku = cleanSku(r['Item Code_QAD'] ?? pick(r, /item.*code|sku/i));
    const loc = getLoc(r);
    const qty = +(r['In transit_Qty'] ?? pick(r, /transit|số lượng|qty/i)) || 0;
    const eta = parseExcelDate(r['ETA_Date'] ?? pick(r, /eta/i));
    if (skipSku(sku) || !qty || !eta) return;
    const g = grp(loc, sku); let exp = parseExcelDate(r['Expiry_Date'] ?? pick(r, /expiry|exp/i)), est = false;
    let slDirect = parseDirectShelfLife(r['Shelf-life'] ?? r['Shelf life'] ?? pick(r, /shelf.*life/i));

    if (!exp && life(sku)) { exp = addMonths(eta, life(sku)); est = true; }
    const mnf = exp && life(sku) ? addMonths(exp, -life(sku)) : null;
    g.tr.push({ exp, mnf, qty, est, m: monthOf(eta), slDirect });
  });

  const plans = Array.isArray(raw.plan) ? raw.plan : (raw.plan?.salesplan || raw.plan?.data || []);
  plans.forEach(r => {
    const sku = cleanSku(r['SKU_Code'] ?? pick(r, /sku/i));
    const m = parseMonth(r['Month'] ?? pick(r, /month|tháng/i));
    const q = +(r['Sell Plan'] ?? pick(r, /sell.*plan|plan/i)) || 0;
    if (skipSku(sku) || !m) return;
    const g = grp(getLoc(r), sku);
    g.plan[m] = (g.plan[m] || 0) + q;
    
    const chnl = String(r['Channel'] ?? pick(r, /channel|kênh/i) ?? '').trim();
    if (/^mt$/i.test(chnl)) g.mtPlan[m] = (g.mtPlan[m] || 0) + q;
    
    g.planDetails.push({
        m: m, channel: chnl,
        customer: String(r['Customers'] ?? pick(r, /customer|khách/i) ?? '').trim(),
        start: parseExcelDate(r['Starting date'] ?? pick(r, /start|bắt/i)),
        end: parseExcelDate(r['Ending date'] ?? pick(r, /end|kết/i)),
        plan: q
    });
  });

  raw.qad.forEach(r => {
    const sku = cleanSku(r['Item Number'] ?? pick(r, /item.*number|mã/i));
    const t = parseExcelDate(r['Invoice Date'] ?? pick(r, /invoice.*date|ngày/i));
    const q = +(r['Qty Invoiced'] ?? pick(r, /qty.*invoiced|số lượng/i)) || 0;
    if (skipSku(sku) || !t) return;
    
    const m = master.get(sku), u = String(r['Unit of Measure'] ?? pick(r, /unit|đơn vị/i) ?? '').trim().toUpperCase();
    const ctn = m ? q / (m.ea[eaLevel(u)] || 1) : q;
    const mo = monthOf(t);
    const loc = getLoc(r);
    const g = grp(loc, sku);
    g.qad[mo] = (g.qad[mo] || 0) + ctn;
    
    const keyCus = String(r['Key Cus'] ?? r['Customer Name'] ?? r['Customer'] ?? pick(r, /key.*cus|khách|customer/i) ?? '').trim();
    const chnlQad = String(r['Channel'] ?? pick(r, /channel|kênh/i) ?? '').trim();
    const cusType = String(r['Customer Type'] ?? pick(r, /customer.*type|loại/i) ?? '').trim();

    // BỎ QUA TẤT CẢ KHÁCH HÀNG KHÔNG PHẢI LÀ MODERN TRADE KHI PHÂN TÍCH KHÁCH HÀNG (MT/TT)
    const upperCusType = cusType.toUpperCase();
    let isModernTrade = upperCusType.startsWith('MODERN TRADE');
    
    if (!isModernTrade && !upperCusType.includes('TRADITIONAL')) {
        return; 
    }

    const mappedPlanCustomer = custypeMap[upperCusType];
    const finalCus = mappedPlanCustomer || keyCus; 
    
    g.qadByCus[mo] = g.qadByCus[mo] || {};
    g.qadByCus[mo][finalCus] = (g.qadByCus[mo][finalCus] || 0) + ctn;
    
    // Ghi lại loại gốc để lọc ở bước sau
    g.transactions.push({ date: t, customer: finalCus, qty: ctn, originalType: upperCusType });
    
    if (/^mt$/i.test(keyCus) || /^mt$/i.test(chnlQad)) g.mtQad[mo] = (g.mtQad[mo] || 0) + ctn;
  });

  G.forEach(g => { 
    const m = master.get(g.sku); 
    g.name = (m && m.name) ? m.name : (g.fallbackName || g.sku);
    g.life = m ? m.life : 0;
    
    const rawN = String(g.name).toLowerCase();
    if(rawN.includes('vermicelli') || rawN.includes('double dragon')) g.line = 'Vermicelli';
    else if(rawN.includes('mix')) g.line = 'MIX';
    else if(rawN.includes('biteez')) g.line = 'BiteeZ';
    else if(rawN.includes('yappy')) g.line = 'Yappy';
    else if(rawN.includes('partee')) g.line = 'ParteeZ';
    else g.line = 'Other';
  });
  
  return [...G.values()].filter(g => /mix|biteez|parteez|yappy|vermicelli|double dragon/i.test(String(g.name)));
}

/* ============ TÍNH TOÁN ============ */
const remain = (plan, qad, m) => plan[m] != null ? (qad[m] != null ? Math.max(plan[m] - qad[m], 0) : plan[m]) : (qad[m] || 0);
const sum = a => a.reduce((s, x) => s + x.qty, 0);
function lotStatus(h) { return h == null ? '' : h <= 0 ? 'EXPIRED' : h < 30 ? 'DISPOSE' : h < 50 ? 'NEAR' : h < 65 ? 'WATCH' : 'SAFE'; }

function compute(M, lineFilter, nameFilterStr, locFilter, cusFilterStr) {
  const end = Date.UTC(CURRENT_YEAR, M, 0), days = new Date(end).getUTCDate(), out = [];
  const nameRe = nameFilterStr ? new RegExp(nameFilterStr, 'i') : null;
  let fLineStr = lineFilter;
  if (fLineStr && fLineStr.toLowerCase() === 'vermicelli') fLineStr = 'vermicelli|double dragon';
  const lineRe = fLineStr && fLineStr !== 'ALL' ? new RegExp(fLineStr, 'i') : null;
  const locRe = locFilter && locFilter !== 'ALL' ? new RegExp('^' + locFilter + '$', 'i') : null;
  const cusRe = cusFilterStr ? new RegExp(cusFilterStr, 'i') : null;

  const sortedSelected = [...SELECTED_FOLDERS].sort((a, b) => (a.y - b.y) || (a.m - b.m) || (a.d - b.d));
  const baseMonth = sortedSelected.length > 0 ? sortedSelected[0].m : CFG.months[0];
  const calcMonths = CFG.months.filter(m => m >= baseMonth && m <= M);

  DB.forEach(g => {
    if (locRe && !locRe.test(String(g.loc || ''))) return;
    if (lineRe && !lineRe.test(String(g.name || ''))) return;
    if (nameRe && !nameRe.test(String(g.name || ''))) return;
    if (cusRe) {
        const hasCusPlan = g.planDetails.some(p => cusRe.test(String(p.customer || p.channel)));
        const hasCusTx = g.transactions.some(tx => cusRe.test(String(tx.customer)));
        if (!hasCusPlan && !hasCusTx) return;
    }
    
    let lots = g.oh.map(l => ({ ...l })), deficit = 0, R = null;
    const latestFolder = sortedSelected.length > 0 ? sortedSelected[sortedSelected.length - 1] : null;
    
    calcMonths.forEach(m => {
      const begin = sum(lots) - deficit, inn = g.tr.filter(t => t.m === m);
      inn.forEach(t => lots.push({ ...t }));
      lots.sort((a, b) => (a.exp ?? 9e15) - (b.exp ?? 9e15));                  
      
      let so = 0;
      const eomMonth = SELECTED_FOLDERS.find(f => f.m === m && f.isEOM && f.y === CURRENT_YEAR);
      if (eomMonth) { so = 0; } 
      else if (latestFolder && m > latestFolder.m) { so = g.plan[m] || 0; } 
      else { so = (m === baseMonth && g.plan[m] == null && !CFG.baseNoPlanUseQad) ? 0 : remain(g.plan, g.qad, m); }

      let rem = so + deficit;
      for (const l of lots) { if (rem <= 0) break; const t = Math.min(l.qty, rem); l.qty -= t; rem -= t; }
      deficit = rem;
      R = { begin, tr: sum(inn), so, ending: sum(lots) - deficit };
    });
    
    if (!R) return;
    const isFutureM = latestFolder && M > latestFolder.m;
    const mtDem = isFutureM ? (g.mtPlan[M] || 0) : remain(g.mtPlan, g.mtQad, M);
    const totalDem = R.so;
    const dl = lots.filter(l => l.qty > 0).map(l => { const h = l.slDirect != null ? l.slDirect : null; return { ...l, h, st: lotStatus(h) }; });
    const invLots = [...g.oh, ...g.tr.filter(t => t.m <= M)].map(l => { const h = l.slDirect != null ? l.slDirect : null; return { ...l, h }; });

    const mtQual = dl.filter(l => l.h != null && l.h >= 60).reduce((s, l) => s + l.qty, 0);
    const limit = g.plan[M] > 0 && g.life ? g.plan[M] * 0.3 * g.life : null;
    let sku = '';
    if (R.ending < 0) sku = 'SHORT';
    else if (R.ending >= totalDem && mtQual < mtDem) sku = 'SHORT_MT';
    else if (R.so > 0 && R.ending < R.so / days * 14) sku = 'BELOW';
    else if (limit != null && R.ending > limit) sku = 'OVER';
    
    const isReportingMonthEOM = SELECTED_FOLDERS.some(f => f.m === M && f.isEOM && f.y === CURRENT_YEAR);
    const covDem = isReportingMonthEOM ? (g.qad[M] || 0) : (g.plan[M] || 0);
    const cov = R.ending < 0 ? 0 : (covDem > 0 ? (R.ending / covDem) * days : null);
    
    out.push({ ...R, g, days, cov, sku, lots: dl, invLots, mtQual, mtDem });
  });

}

                        expMonthsData.push({ date: mKey, diff: diff, qty: qty, color: colColor });
                    }
                });
                window.chartState[lineKey].rows[rowIdx] = { sku: r.g.sku, name: r.g.name, lots: expMonthsData };
            }
            const hasDetails = detailKeys.length > 0;
            const btnHtml = hasDetails ? `<button type="button" class="acc-btn" onclick="window.toggleRow(this, ${rowIdx}, '${lineKey}')">[+]</button>` : '';
            
            body += `<tr><td>${esc(r.g.loc)}</td><td>${esc(r.g.sku)}</td><td>${btnHtml}${esc(r.g.name)}</td><td class="n">${b30 > 0 ? fmt(b30) : ''}</td><td class="n">${b50 > 0 ? fmt(b50) : ''}</td><td class="n">${b60 > 0 ? fmt(b60) : ''}</td><td class="n">${b70 > 0 ? fmt(b70) : ''}</td><td class="n">${bgt70 > 0 ? fmt(bgt70) : ''}</td><td class="n" style="font-weight:bold; background:#f0f3f2">${fmt(rTotal)}</td></tr>`;
            if(hasDetails) {
                detailKeys.forEach(mKey => {
                    const dVals = details[mKey]; const dTotal = dVals.b30 + dVals.b50 + dVals.b60 + dVals.b70 + dVals.bgt70;
                    if(dTotal > 0) {
                        body += `<tr class="subrow-${rowIdx}" hidden style="background:var(--ac2); font-size:0.95em;"><td></td><td></td><td style="padding-left: 28px; color:var(--mut)">&#8627; ${tt('date')}: <b style="color:var(--fg)">${mKey}</b></td><td class="n">${dVals.b30 > 0 ? fmt(dVals.b30) : ''}</td><td class="n">${dVals.b50 > 0 ? fmt(dVals.b50) : ''}</td><td class="n">${dVals.b60 > 0 ? fmt(dVals.b60) : ''}</td><td class="n">${dVals.b70 > 0 ? fmt(dVals.b70) : ''}</td><td class="n">${dVals.bgt70 > 0 ? fmt(dVals.bgt70) : ''}</td><td class="n" style="font-weight:bold">${fmt(dTotal)}</td></tr>`;
                    }
                });
            }
        }
    });

    const subtext = tt('subtotal');
    const subRow = body ? `<tr style="font-weight:bold;background:var(--ac2);position:sticky;bottom:0;z-index:1;box-shadow:0 -1px 0 var(--line)"><td colspan="3" style="text-align:right">${subtext}</td><td class="n">${t30 > 0 ? fmt(t30) : ''}</td><td class="n">${t50 > 0 ? fmt(t50) : ''}</td><td class="n">${t60 > 0 ? fmt(t60) : ''}</td><td class="n">${t70 > 0 ? fmt(t70) : ''}</td><td class="n">${tgt70 > 0 ? fmt(tgt70) : ''}</td><td class="n" style="background:#d7dfdc">${tTotal > 0 ? fmt(tTotal) : ''}</td></tr>` : '';

    let validKeys = Object.keys(window.chartState).filter(k => { let d = window.chartState[k].doughnutData; return (d.b30 + d.b50 + d.b60 + d.b70 + d.bgt70) > 0; });
    let chartHtml = `<div class="chart-grid ${validKeys.length === 1 ? 'single-chart' : ''}">`;
    validKeys.forEach((k, idx) => { 
        window.chartState[k].idx = idx; 
        let isSingle = validKeys.length === 1;
        let extraStyle = isSingle ? 'max-width: 320px; max-height: 320px; margin: 0 auto;' : '';
        let legendHtml = '';
        
        if (isSingle) {
            let d = window.chartState[k].doughnutData;
            let total = d.b30 + d.b50 + d.b60 + d.b70 + d.bgt70;
            if (total > 0) {
                legendHtml = `
                <div style="margin-top: 20px; width: 100%; max-width: 320px; margin-left: auto; margin-right: auto;">
                    <table style="width: 100%; border-collapse: collapse; font-size: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow);">
                        <tr style="background: var(--ac2); color: var(--ac); font-weight: bold;">
                            <th style="padding: 8px; border-bottom: 1px solid var(--line); text-align: left;">Shelf life</th>
                            <th style="padding: 8px; border-bottom: 1px solid var(--line); text-align: right;">% (Total: ${fmt(total)})</th>
                        </tr>
                        ${d.b30 > 0 ? `<tr><td style="padding: 6px 8px; border-bottom: 1px solid var(--line);"><span style="display:inline-block;width:12px;height:12px;background:#d9232d;margin-right:6px;border-radius:2px;vertical-align:middle;"></span>&lt;30%</td><td style="padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line);">${(d.b30/total*100).toFixed(1)}%</td></tr>` : ''}
                        ${d.b50 > 0 ? `<tr><td style="padding: 6px 8px; border-bottom: 1px solid var(--line);"><span style="display:inline-block;width:12px;height:12px;background:#fd7e14;margin-right:6px;border-radius:2px;vertical-align:middle;"></span>30-50%</td><td style="padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line);">${(d.b50/total*100).toFixed(1)}%</td></tr>` : ''}
                        ${d.b60 > 0 ? `<tr><td style="padding: 6px 8px; border-bottom: 1px solid var(--line);"><span style="display:inline-block;width:12px;height:12px;background:#ffc107;margin-right:6px;border-radius:2px;vertical-align:middle;"></span>50-60%</td><td style="padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line);">${(d.b60/total*100).toFixed(1)}%</td></tr>` : ''}
                        ${d.b70 > 0 ? `<tr><td style="padding: 6px 8px; border-bottom: 1px solid var(--line);"><span style="display:inline-block;width:12px;height:12px;background:#28a745;margin-right:6px;border-radius:2px;vertical-align:middle;"></span>60-70%</td><td style="padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line);">${(d.b70/total*100).toFixed(1)}%</td></tr>` : ''}
                        ${d.bgt70 > 0 ? `<tr><td style="padding: 6px 8px; border-bottom: 1px solid var(--line);"><span style="display:inline-block;width:12px;height:12px;background:#20c997;margin-right:6px;border-radius:2px;vertical-align:middle;"></span>&gt;70%</td><td style="padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line);">${(d.bgt70/total*100).toFixed(1)}%</td></tr>` : ''}
                    </table>
                </div>`;
            }
        }

        chartHtml += `<div class="chart-wrapper"><strong style="font-size:14px;text-transform:uppercase;color:var(--fg); margin-bottom: 10px;">${k}</strong><div class="canvas-container" style="${extraStyle}"><canvas id="donutChart${idx}"></canvas></div>${legendHtml}</div>`; 
    });
    chartHtml += `</div>`;

    h = `
    <div class="inv-layout">
        <div class="inv-table-col"><div class="wrap"><table>
            <tr><th>WH</th><th>Pd Code</th><th>Pd Name</th><th class="text-center hsd-30">&lt;30%</th><th class="text-center hsd-50">30-50%</th><th class="text-center hsd-60">50-60%</th><th class="text-center hsd-70">60-70%</th><th class="text-center hsd-gt70">&gt;70%</th><th class="text-center hsd-total">${tt('thTotal')}</th></tr>
            ${body || `<tr><td colspan="9" class="empty">${tt('empty')}</td></tr>`}
            ${subRow}
        </table></div></div>
        <div class="inv-chart-col">${chartHtml}</div>
    </div>`;

    $('#view').innerHTML = '<div class="animated-view">' + h + '</div>';
    setTimeout(() => { validKeys.forEach(k => { window.drawChart(k); }); }, 100); return;
  }
  
  else {
    let noteHTML = `<div class="note" style="margin-top:16px; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:var(--border-radius); line-height:1.6; color:var(--fg)">${tt('logicNote')}</div>`;
    
    const logicData = HARDCODED_LOGIC.map(item => {
        return { id: item.id, ...item[lang] };
    });

    h = `<div class="wrap"><table>
        <tr><th>${esc(tt('warn'))}</th><th>${esc(tt('cond'))}</th><th>${esc(tt('risk'))}</th><th>${esc(tt('act'))}</th></tr>
        ${logicData.map(r => `<tr>
            <td>${badge(r.id)}</td>
            <td style="white-space:normal;min-width:180px">${esc(r.cond).replace(/\\n/g,'<br>')}</td>
            <td style="white-space:normal;min-width:180px">${esc(r.risk).replace(/\\n/g,'<br>')}</td>
            <td style="white-space:normal;min-width:220px">${esc(r.act).replace(/\\n/g,'<br>')}</td>
        </tr>`).join('')}
    </table></div>` + noteHTML;
  }
  $('#view').innerHTML = '<div class="animated-view">' + h + '</div>';
}

/* ============ KHỞI TẠO GIAO DIỆN & TẢI DỮ LIỆU ============ */
function setLang(l) {
  lang = l; 
  $('#lvi').classList.toggle('on', l === 'vi'); $('#len').classList.toggle('on', l === 'en'); 
  
  $$('[data-t]').forEach(e => {
    if (e.tagName === 'INPUT' && e.hasAttribute('placeholder')) {
        e.placeholder = tt(e.dataset.t);
    } else {
        e.innerHTML = tt(e.dataset.t);
    }
  });
  
  $('#ttl').textContent = tt('ttl'); 
  document.title = tt('ttl');
  $('#btnOut').textContent = tt('out'); 
  $('#btnAddFolder').title = tt('addDate');
  
  $('#fProd').placeholder = l === 'vi' ? 'Gõ tên SP...' : 'Type product name...';
  $('#fCus').placeholder = l === 'vi' ? 'Gõ tên khách...' : 'Type customer name...';

  let activeSels = $$('.folder-sel');
  activeSels.forEach(sel => {
    let firstOpt = sel.querySelector('option[value=""]');
    if (firstOpt) firstOpt.textContent = '-- ' + tt('selDatePlaceholder') + ' --';
  });

  $$('.tabs button').forEach(b => { b.textContent = tt(b.dataset.tab); b.classList.toggle('on', b.dataset.tab === tab); });
  updateTabSlider();
  if(DB) { fillFilters(); render(); }
}

function fillFilters() {
  const curL = $('#fLine').value;
  $('#fLine').innerHTML = [['ALL', 'all'], ['mix', 0], ['biteez', 0], ['yappy', 0], ['partee', 0], ['vermicelli', 0]].map(([v, k], i) => `<option value="${v}">${k ? tt('all') : ['', 'MIX', 'BiteeZ', 'Yappy', 'ParteeZ', 'Vermicelli'][i]}</option>`).join('');
  if (curL) $('#fLine').value = curL;
  const curLoc = $('#fLoc').value || 'ALL'; $('#fLoc').innerHTML = `<option value="ALL">${tt('all')}</option><option value="South">South</option><option value="North">North</option>`; $('#fLoc').value = curLoc;
  fillMonthDropdown(); fillWarn();
}
function fillMonthDropdown() { const curM = $('#fMonth').value; $('#fMonth').innerHTML = CFG.months.map(m => `<option value="${m}">${tt('mon')} ${m} (${MN[m - 1].replace(/^./, c => c.toUpperCase())})</option>`).join(''); if (curM && CFG.months.includes(+curM)) $('#fMonth').value = curM; }
function fillWarn() { const cur = $('#fWarn').value || 'ALL'; $('#fWarn').innerHTML = `<option value="ALL">${tt('all')}</option>` + Object.keys(ST).filter(k=>k!=='EMPTY').map(k => `<option value="${k}">${ST[k][lang === 'vi' ? 0 : 1]}</option>`).join(''); $('#fWarn').value = cur; }

const cache = {};
async function readXlsx(folder, file) {
  const path = `${folder}/${file}`; if (cache[path]) return cache[path];
  const { data, error } = await sb.storage.from(CFG.bucket).download(path);
  if (error) throw new Error(path + ': ' + error.message);
  const wb = XLSX.read(await data.arrayBuffer(), { type: 'array', cellDates: true });
  return (cache[path] = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: null }));
}

const HOME_URL = 'https://jamesnguyen842.github.io/Summary-MKT-Report/';

async function checkAuth() {
  try {
    sb = sb || supabase.createClient(CFG.url, CFG.key);
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      window.location.replace(HOME_URL);
      return;
    }

    sb.auth.onAuthStateChange((event, sess) => {
      if (event === 'SIGNED_OUT' || !sess) {
        window.location.replace(HOME_URL);
      }
    });

    $('#app').hidden = false;
    document.body.classList.add('logged-in');
    setLang(lang);
    $('#dataStatus').textContent = tt('loadingFolders');
    $('#view').innerHTML = `<div class="empty">${tt('empty')}</div>`;

    const { data: list, error } = await sb.storage.from(CFG.bucket).list('', { limit: 1000 });
    if (error) throw new Error('Không lấy được danh sách: ' + error.message);
    ALL_FOLDERS = (list || [])
      .map(i => {
        const m = i.name.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
        if (m) return { name: i.name, d: +m[1], m: +m[2], y: +m[3], isEOM: +m[1] === new Date(+m[3], +m[2], 0).getDate() };
        return null;
      })
      .filter(Boolean)
      .sort((a, b) => b.y - a.y || b.m - a.m || b.d - a.d);

    $('#dataStatus').textContent = '';
    addFolderSelect();
  } catch (e) {
    $('#dataStatus').textContent = 'Lỗi: ' + (e.message || e);
  }
}

function addFolderSelect() { const sel = document.createElement('select'); sel.className = 'folder-sel'; sel.innerHTML = `<option value="">-- ${tt('selDatePlaceholder')} --</option>` + ALL_FOLDERS.map(f => `<option value="${f.name}">${f.name}</option>`).join(''); $('#folder-container').appendChild(sel); }  

async function confirmLoadData() { 
  const sels = $$('.folder-sel').map(s => s.value).filter(Boolean); if (!sels.length) return alert(tt('reqErr'));
  const selected = sels.map(name => ALL_FOLDERS.find(f => f.name === name));
  const monthKeys = selected.map(f => `${f.m}-${f.y}`); if (new Set(monthKeys).size !== monthKeys.length) return alert(tt('dupErr'));
  SELECTED_FOLDERS = selected; $('#dataStatus').textContent = tt('wait');
  
  try {
    const sorted = [...selected].sort((a, b) => a.y - b.y || a.m - b.m || a.d - b.d);
    const base = sorted[0], latest = sorted[sorted.length - 1]; 
    const res = await fetch(CFG.planUrl, { redirect: 'follow' });
    if (res.ok) { const j = await res.json(); cache['api_plan'] = j['Sales plan']||[]; cache['api_unit'] = j['unit']||[]; cache['api_sku'] = j['sku']||[]; cache['api_custype'] = j['custype']||[]; cache['api_logic'] = j['Logic']||[]; }
    LOGIC_RULES = cache['api_logic'] || [];
    const [master, onhand, transit] = await Promise.all(['master', 'onhand', 'transit'].map(k => readXlsx(base.name, CFG.files[k]).catch(()=>[])));
    const latestQad = await readXlsx(latest.name, CFG.files.qad).catch(()=>[]); let allQadData = [...latestQad];
    const presentMonths = new Set();
    latestQad.forEach(r => { const t = parseExcelDate(r['Invoice Date'] ?? pick(r, /invoice.*date|ngày/i)); if (t) { const d = new Date(t); presentMonths.add(`${d.getUTCMonth()+1}-${d.getUTCFullYear()}`); } });
    const neededMonths = new Set();
    (cache['api_plan'] || []).forEach(p => { const sd = parseExcelDate(p['Starting date'] ?? pick(p, /start|bắt/i)); const ed = parseExcelDate(p['Ending date'] ?? pick(p, /end|kết/i)); if (sd) { const d = new Date(sd); neededMonths.add(`${d.getUTCMonth()+1}-${d.getUTCFullYear()}`); } if (ed) { const d = new Date(ed); neededMonths.add(`${d.getUTCMonth()+1}-${d.getUTCFullYear()}`); } });
    const extraPromises = [];
    for (const mKey of neededMonths) {
        if (!presentMonths.has(mKey)) {
            const [mStr, yStr] = mKey.split('-'); const m = +mStr, y = +yStr; const folder = ALL_FOLDERS.find(f => f.m === m && f.y === y && f.isEOM) || ALL_FOLDERS.find(f => f.m === m && f.y === y);
            if (folder) { presentMonths.add(mKey); extraPromises.push(readXlsx(folder.name, CFG.files.qad).catch(()=>[])); }
        }
    }
    if (extraPromises.length > 0) { const extraQads = await Promise.all(extraPromises); extraQads.forEach(eq => allQadData = allQadData.concat(eq)); }
    const years = [...new Set(selected.map(f => f.y))].sort((a,b)=>b-a); $('#fYear').innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join(''); CURRENT_YEAR = years[0] || CFG.year;
    DB = normalize({ master, onhand, transit, qad: allQadData, plan: cache['api_plan']||[], unit: cache['api_unit']||[], sku: cache['api_sku']||[], custype: cache['api_custype']||[] });
    $('#dataStatus').textContent = tt('loaded'); fillFilters(); render();
  } catch (e) { $('#dataStatus').textContent = 'Lỗi: ' + e.message; }
}

/* ============ SỰ KIỆN ============ */
  $('#btnOut').onclick = async () => {
  try { await sb?.auth.signOut(); } catch (e) {}
  window.location.replace(HOME_URL);
};
checkAuth();
$('#lvi').onclick = () => setLang('vi'); $('#len').onclick = () => setLang('en');
$('#btnAddFolder').onclick = addFolderSelect; $('#btnLoadData').onclick = confirmLoadData;
$('#fYear').onchange = (e) => { CURRENT_YEAR = +e.target.value; render(); };
$('#fProd').oninput = render; $('#fCus').oninput = render; 
['#fLoc', '#fLine', '#fMonth', '#fWarn'].forEach(s => $(s).onchange = render);
$$('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; $$('.tabs button').forEach(btn => btn.classList.toggle('on', btn.dataset.tab === tab)); updateTabSlider(); render(); });  
</script>

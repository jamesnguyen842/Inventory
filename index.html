<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Báo cáo tổng hợp tồn kho</title>
<style>
:root{--bg:#f5f6f4;--fg:#1c2421;--mut:#66706b;--card:#fff;--line:#d9dedb;--ac:#1f6f5c;--ac2:#e8f1ee}
@media(prefers-color-scheme:dark){:root{--bg:#141917;--fg:#e6ebe8;--mut:#93a09a;--card:#1d2421;--line:#2f3a35;--ac:#4fb59b;--ac2:#22302b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:6px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#login{max-width:340px;margin:12vh auto;background:var(--card);border:1px solid var(--line);padding:28px;border-radius:10px;display:grid;gap:12px}
#login h2{margin:0 0 4px}
input,select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);width:100%}
.err{color:#b3261e;min-height:1.2em}
header{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:22px;margin:0;flex:1}
.filters{display:flex;gap:16px;padding:14px 24px;flex-wrap:wrap}
.filters label{display:grid;gap:3px;min-width:170px;color:var(--mut);font-size:12px}
.tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 16px}
.tabs button.on{border-bottom-color:var(--ac);background:none;color:var(--ac);font-weight:600}
main{padding:16px 24px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--ac2);position:sticky;top:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.neg{color:#b3261e;font-weight:600}
.b{padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid}
.ok{color:#1e7a4a;background:#e3f4ea;border-color:#b7e0c6}
.wt{color:#7a6a12;background:#f8f1cf;border-color:#e6d98b}
.nr{color:#96570f;background:#fbe9d0;border-color:#efc78f}
.dp{color:#a2400c;background:#f9d9c6;border-color:#eba57f}
.ex{color:#a3201a;background:#f8d7d4;border-color:#e59b95}
.note{color:var(--mut);margin:0 0 10px}
.empty{padding:28px;text-align:center;color:var(--mut)}
#status{padding:0 24px;color:var(--mut)}
</style>
</head>
<body>

<div id="login">
  <h2>Đăng nhập</h2>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button class="pri" id="btnLogin">Đăng nhập</button>
  <button id="btnDemo">Chạy dữ liệu mẫu</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" hidden>
  <header>
    <h1 id="ttl"></h1>
    <button id="lvi" class="on">Vi</button><button id="len">En</button>
    <button id="btnOut"></button>
  </header>
  <div class="filters">
    <label><span data-t="line"></span><select id="fLine"></select></label>
    <label><span data-t="month"></span><select id="fMonth"></select></label>
    <label><span data-t="warn"></span><select id="fWarn"></select></label>
  </div>
  <div id="status"></div>
  <div class="tabs">
    <button data-tab="sum" class="on"></button><button data-tab="det"></button><button data-tab="logic"></button>
  </div>
  <main><div id="view"></div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============ CẤU HÌNH ============ */
const CFG = {
  url: 'https://didthuazwmuxddlxhkob.supabase.co',
  key: 'sb_publishable_qDGjgGQ06a5w8_DM903-UQ_cMEuI-lw',
  bucket: 'inventory',
  files: { master:'master.xlsx', onhand:'onhand.xlsx', qad:'qad.xlsx', transit:'transit.xlsx' },
  planUrl: 'https://script.google.com/macros/s/AKfycbxO9zT33UapiEpEoCgRGQXr6uexQ-WIToK74iS_pXVMob_zA7Fw81l8AtpX1tZvRrOZuw/exec',
  year: 2026, months: [9,10,11,12],
  baseNoPlanUseQad: false
};

/* ============ ĐA NGÔN NGỮ ============ */
const T = {
 vi:{ttl:'Báo cáo tổng hợp tồn kho',line:'Ngành hàng',month:'Tháng báo cáo',warn:'Cảnh báo',all:'Tất cả',sum:'Form sum',det:'Form detail',logic:'Logic',
  out:'Đăng xuất',loc:'Kho',sku:'SKU',prod:'Sản phẩm',lineC:'Ngành',begin:'Tồn đầu kỳ',tr:'In transit',so:'Sell out',end:'Tồn cuối kỳ',cov:'Coverday',
  st:'Trạng thái',lot:'Trạng thái lô',skuSt:'Trạng thái SKU',mnf:'NSX',exp:'HSD',hsd:'% HSD',qty:'Tồn cuối lô',empty:'Không có dữ liệu',
  mon:'Tháng',cond:'Điều kiện',note:'Bộ lọc, tính FIFO lũy kế từ tháng 9 đến tháng đã chọn. Lô có tồn cuối = 0 bị ẩn.',
  loading:'Đang tải dữ liệu...',demo:'Đang dùng dữ liệu mẫu',loaded:'Đã tải dữ liệu thật',lerr:'Đăng nhập thất bại: ',est:'HSD ước tính'},
 en:{ttl:'Inventory Summary Report',line:'Product line',month:'Report month',warn:'Warning',all:'All',sum:'Form sum',det:'Form detail',logic:'Logic',
  out:'Log out',loc:'Warehouse',sku:'SKU',prod:'Product',lineC:'Line',begin:'Opening stock',tr:'In transit',so:'Sell out',end:'Ending inventory',cov:'Coverday',
  st:'Status',lot:'Lot status',skuSt:'SKU status',mnf:'MNF',exp:'EXP',hsd:'% Shelf-life',qty:'Lot ending',empty:'No data',
  mon:'Month',cond:'Condition',note:'Filters and cumulative FIFO from September up to the selected month. Lots with zero ending stock are hidden.',
  loading:'Loading data...',demo:'Using sample data',loaded:'Live data loaded',lerr:'Login failed: ',est:'Estimated EXP'}
};
const ST = { // [vi, en, css]
 SAFE:['An toàn','Safe','ok'], WATCH:['Theo dõi (50–65%)','Watch (50–65%)','wt'], NEAR:['Cận date (<50%)','Near expiry (<50%)','nr'],
 DISPOSE:['Hủy hàng (<30%)','Dispose (<30%)','dp'], EXPIRED:['Hết hạn SD','Expired','ex'], SHORT:['Thiếu hàng','Out of stock','ex'],
 SHORT_MT:['Thiếu hàng kênh MT','MT channel shortage','dp'], BELOW:['Dưới an toàn','Below safety','nr'], OVER:['Vượt nhu cầu','Over demand','wt']
};
const RULES = [
 ['EXPIRED','%HSD ≤ 0'],['SHORT','Ending SKU < 0'],['SHORT_MT','Ending ≥ Demand && MT_Qualified(≥60%) < MT_Demand'],
 ['DISPOSE','0 < %HSD < 30'],['NEAR','30 ≤ %HSD < 50'],['WATCH','50 ≤ %HSD < 65'],
 ['BELOW','0 ≤ Ending < Sell out/days × 14'],['OVER','Ending > Plan × 30% × Useful Life(month)'],['SAFE','%HSD ≥ 65 && SKU status = ∅']
];

/* ============ TIỆN ÍCH ============ */
const $= s => document.querySelector(s),$$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n == null ? '—' : (Math.round(n * 10) / 10).toLocaleString('en-US');
const MN = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
let lang = 'vi', sb = null, DB = null, tab = 'sum';

const pick = (r, re) => { const k = Object.keys(r).find(k => re.test(String(k).trim())); return k ? r[k] : undefined; };
const day = ms => Math.floor(ms / 864e5) * 864e5;
const addMonths = (ms, n) => { const d = new Date(ms); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, d.getUTCDate()); };

// Chuẩn hóa ngày: serial Excel, Date, ms, chuỗi dd/mm/yyyy
function parseExcelDate(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : Date.UTC(v.getFullYear(), v.getMonth(), v.getDate());
  if (typeof v === 'number') return v > 1e10 ? day(v) : day(Math.round((v - 25569) * 864e5)); // mốc 30/12/1899
  const s = String(v).trim(), m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) return Date.UTC(+m[3] < 100 ? 2000 + +m[3] : +m[3], +m[2] - 1, +m[1]);
  const t = Date.parse(s); return isNaN(t) ? null : day(t);
}
const monthOf = ms => new Date(ms).getUTCMonth() + 1;
function parseMonth(v) {
  if (v instanceof Date || (typeof v === 'number' && v > 100)) { const t = parseExcelDate(v); return t ? monthOf(t) : null; }
  const s = String(v ?? '').trim().toLowerCase(), i = MN.findIndex(m => s.startsWith(m));
  return i >= 0 ? i + 1 : (+s.replace(/\D/g, '') || null);
}
function normLoc(v) {
  const s = String(v ?? '').trim();
  if (s === '11001' || /^hcmc$/i.test(s) \vert{}\vert{} /^south$/i.test(s)) return 'South';
  if (s === '15001' || /^hanoi$/i.test(s) \vert{}\vert{} /^north$/i.test(s)) return 'North';
  return s;
}
const cleanSku = v => String(v ?? '').trim().replace(/-01$/, '');
const skipSku = s => !s || /^(CKCT|MD|QD)/i.test(s);

/* ============ CHUẨN HÓA DỮ LIỆU THÔ ============ */
function normalize(raw) {
  const master = new Map();
  raw.master.forEach(r => {
    const code = String(r['Item Code_QAD'] ?? '').trim(); if (!code) return;
    master.set(code, {
      name: pick(r, /^(tên hh|ten hh)/i) ?? '', line: String(pick(r, /^product line$/i) ?? ''),
      life: +pick(r, /useful life/i) || 0,
      ea: { 1: +pick(r, /^ea qty #1/i) || 1, 2: +pick(r, /^ea qty #2/i) || 1, 3: +pick(r, /^ea qty #3/i) || 1 }
    });
  });
  const unitMap = {};
  (raw.unit || []).forEach(r => { unitMap[String(pick(r, /^(unit|đơn vị|mã)/i) ?? Object.values(r)[0]).trim()] = String(pick(r, /ea qty type/i) ?? ''); });
  const eaLevel = u => { const t = unitMap[u] || ''; return /3|cn|can/i.test(t) ? 3 : /2|pack/i.test(t) ? 2 : 1; };

  const G = new Map();
  const grp = (loc, sku) => {
    const k = loc + '|' + sku;
    if (!G.has(k)) G.set(k, { loc, sku, line: '', oh: [], tr: [], plan: {}, mtPlan: {}, qad: {}, mtQad: {} });
    return G.get(k);
  };
  const life = s => master.get(s)?.life || 0;

  raw.onhand.forEach(r => {
    const sku = cleanSku(r.SKU_Code), loc = normLoc(r.Location), qty = +r['Q.ty On-Hand'] || 0; if (skipSku(sku) || !qty) return;
    const g = grp(loc, sku); g.line = g.line || String(r['Product Line'] ?? '');
    const exp = parseExcelDate(r['Expiry Date']); let mnf = parseExcelDate(r['MNF Date']);
    if (!mnf && exp && life(sku)) mnf = addMonths(exp, -life(sku));
    g.oh.push({ exp, mnf, qty, est: false });
  });
  raw.transit.forEach(r => {
    const sku = cleanSku(r['Item Code_QAD']), loc = normLoc(r.Location), qty = +r['In transit_Qty'] || 0;
    const eta = parseExcelDate(r.ETA_Date); if (skipSku(sku) || !qty || !eta) return;
    const g = grp(loc, sku); let exp = parseExcelDate(r.Expiry_Date), est = false;
    if (!exp && life(sku)) { exp = addMonths(eta, life(sku)); est = true; }   // EXP trống -> ước tính
    const mnf = exp && life(sku) ? addMonths(exp, -life(sku)) : null;         // transit không có MNF
    g.tr.push({ exp, mnf, qty, est, m: monthOf(eta) });
  });
  const plans = Array.isArray(raw.plan) ? raw.plan : (raw.plan?.salesplan || raw.plan?.data || []);
  plans.forEach(r => {
    const sku = cleanSku(r.SKU_Code), m = parseMonth(r.Month), q = +r['Sell Plan'] || 0; if (skipSku(sku) || !m) return;
    const g = grp(normLoc(r.Warehouse), sku); g.line = g.line || String(r['Product Line'] ?? '');
    g.plan[m] = (g.plan[m] || 0) + q; if (/^mt$/i.test(String(r.Channel).trim())) g.mtPlan[m] = (g.mtPlan[m] || 0) + q;
  });
  raw.qad.forEach(r => {
    const sku = cleanSku(r['Item Number']), t = parseExcelDate(r['Invoice Date']), q = +r['Qty Invoiced'] || 0; if (skipSku(sku) || !t) return;
    const m = master.get(sku), u = String(r['Unit of Measure'] ?? '').trim();
    const ctn = m ? q / (m.ea[eaLevel(u)] || 1) : q;                           // quy đổi về thùng
    const g = grp(normLoc(r.HQ), sku), mo = monthOf(t);
    g.qad[mo] = (g.qad[mo] || 0) + ctn; if (/^mt$/i.test(String(r['Key Cus'] ?? '').trim())) g.mtQad[mo] = (g.mtQad[mo] || 0) + ctn;
  });
  
  // Ưu tiên dòng sản phẩm từ onhand, nếu thiếu thì lấy từ master
  G.forEach(g => { const m = master.get(g.sku); if (m) { g.name = m.name; g.life = m.life; g.line = g.line || m.line; } });
  return [...G.values()];
}

/* ============ TÍNH TOÁN (FIFO LŨY KẾ) ============ */
const remain = (plan, qad, m) => plan[m] != null ? (qad[m] != null ? Math.max(plan[m] - qad[m], 0) : plan[m]) : (qad[m] || 0);
const sum = a => a.reduce((s, x) => s + x.qty, 0);
function lotStatus(h) { return h == null ? '' : h <= 0 ? 'EXPIRED' : h < 30 ? 'DISPOSE' : h < 50 ? 'NEAR' : h < 65 ? 'WATCH' : 'SAFE'; }

function compute(M, lineRe) {
  const end = Date.UTC(CFG.year, M, 0), days = new Date(end).getUTCDate(), out = [];
  DB.forEach(g => {
    if (lineRe && !lineRe.test(g.line)) return;
    let lots = g.oh.map(l => ({ ...l })), deficit = 0, R = null;
    CFG.months.filter(m => m <= M).forEach(m => {
      const begin = sum(lots) - deficit, inn = g.tr.filter(t => t.m === m);
      inn.forEach(t => lots.push({ ...t }));
      lots.sort((a, b) => (a.exp ?? 9e15) - (b.exp ?? 9e15));                  // FIFO/FEFO theo EXP, null xuống cuối
      let so = (m === CFG.months[0] && g.plan[m] == null && !CFG.baseNoPlanUseQad) ? 0 : remain(g.plan, g.qad, m);
      let rem = so + deficit;
      for (const l of lots) { if (rem <= 0) break; const t = Math.min(l.qty, rem); l.qty -= t; rem -= t; }
      deficit = rem;
      R = { begin, tr: sum(inn), so, ending: sum(lots) - deficit };
    });
    if (!R) return;
    const mtDem = remain(g.mtPlan, g.mtQad, M), totalDem = R.so;
    const dl = lots.filter(l => l.qty > 0).map(l => {
      const h = l.exp && l.mnf && l.exp > l.mnf ? (l.exp - end) / (l.exp - l.mnf) * 100 : null;
      return { ...l, h, st: lotStatus(h) };
    });
    const mtQual = dl.filter(l => l.h != null && l.h >= 60).reduce((s, l) => s + l.qty, 0);
    const limit = g.plan[M] > 0 && g.life ? g.plan[M] * 0.3 * g.life : null;
    let sku = '';
    if (R.ending < 0) sku = 'SHORT';
    else if (R.ending >= totalDem && mtQual < mtDem) sku = 'SHORT_MT';
    else if (R.so > 0 && R.ending < R.so / days * 14) sku = 'BELOW';
    else if (limit != null && R.ending > limit) sku = 'OVER';
    const cov = R.ending < 0 ? 0 : R.so > 0 ? R.ending / R.so * days : null;
    out.push({ ...R, g, days, cov, sku, lots: dl, mtQual, mtDem });
  });
  return out.sort((a, b) => (a.g.loc + a.g.sku).localeCompare(b.g.loc + b.g.sku));
}

/* ============ HIỂN THỊ ============ */
const tt = k => T[lang][k];
const badge = c => c ? `<span class="b ${ST[c][2]}">${esc(ST[c][lang === 'vi' ? 0 : 1])}</span>` : '—';
const th = (...k) => `<tr>${k.map(x => `<th>${esc(tt(x))}</th>`).join('')}</tr>`;
const num = (v, neg) => `<td class="n ${neg && v < 0 ? 'neg' : ''}">${fmt(v)}</td>`;

function passWarn(w, skuSt, lotSts) {
  if (w === 'ALL') return true;
  return skuSt === w || lotSts.includes(w) || (w === 'SAFE' && !skuSt && lotSts.every(s => s === 'SAFE'));
}
function render() {
  if (!DB) return;
  $('#ttl').textContent = tt('ttl'); document.title = tt('ttl');   $$('[data-t]').forEach(e => e.textContent = tt(e.dataset.t));
  $('#btnOut').textContent = tt('out');   $$('.tabs button').forEach(b => { b.textContent = tt(b.dataset.tab); b.classList.toggle('on', b.dataset.tab === tab); });
  const w = $('#fWarn').value, M = +$('#fMonth').value, lv = $('#fLine').value;
  const rows = compute(M, lv === 'ALL' ? null : new RegExp(lv, 'i'));
  let h = '';
  if (tab === 'sum') {
    const body = rows.filter(r => passWarn(w, r.sku, r.lots.map(l => l.st))).map(r => {
      const worst = r.lots.length ? r.lots.reduce((a, b) => (b.h ?? 1e9) < (a.h ?? 1e9) ? b : a).st : '';
      return `<tr><td>${esc(r.g.loc)}</td><td>${esc(r.g.sku)}</td><td>${esc(r.g.name)}</td><td>${esc(r.g.line)}</td>${num(r.begin)}${num(r.tr)}${num(r.so)}${num(r.ending, 1)}<td class="n">${fmt(r.cov)}</td><td>${badge(r.sku || worst)}</td></tr>`;
    }).join('');
    h = body ? `<div class="wrap"><table>${th('loc','sku','prod','lineC','begin','tr','so','end','cov','st')}${body}</table></div>` : `<div class="empty">${tt('empty')}</div>`;
  } else if (tab === 'det') {
    let body = '';
    rows.forEach(r => r.lots.forEach(l => {
      if (!passWarn(w, r.sku, [l.st]) && !(w === r.sku)) return;
      if (w !== 'ALL' && w !== r.sku && l.st !== w && !(w === 'SAFE' && l.st === 'SAFE' && !r.sku)) return;
      const d = x => x ? new Date(x).toISOString().slice(0, 10) : '—';
      body += `<tr><td>${esc(r.g.loc)}</td><td>${esc(r.g.sku)}</td><td>${esc(r.g.name)}</td><td>${d(l.mnf)}</td><td>${d(l.exp)}${l.est ? ' *' : ''}</td>${num(l.qty)}<td class="n">${l.h == null ? '—' : fmt(l.h) + '%'}</td><td>${badge(l.st)}</td><td>${badge(r.sku)}</td></tr>`;
    }));
    h = body ? `<p class="note">${tt('note')} <b>*</b> ${tt('est')}</p><div class="wrap"><table>${th('loc','sku','prod','mnf','exp','qty','hsd','lot','skuSt')}${body}</table></div>` : `<div class="empty">${tt('empty')}</div>`;
  } else {
    h = `<div class="wrap"><table>${th('st','cond')}${RULES.map(r => `<tr><td>${badge(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table></div>`;
  }
  $('#view').innerHTML = h;
}

/* ============ KHỞI TẠO GIAO DIỆN ============ */
function fillFilters() {
  const curL = $('#fLine').value;
  const curM = $('#fMonth').value;
  $('#fLine').innerHTML = [['ALL', 'all'], ['^mix', 0], ['^biteez', 0], ['^yappy', 0], ['^partee', 0]].map(([v, k], i) => `<option value="${v}">${k ? tt('all') : ['', 'MIX', 'BiteeZ', 'Yappy', 'ParteeZ'][i]}</option>`).join('');
  $('#fMonth').innerHTML = CFG.months.map(m => `<option value="${m}">${tt('mon')} ${m} (${MN[m - 1].replace(/^./, c => c.toUpperCase())})</option>`).join('');
  if (curL) $('#fLine').value = curL;
  if (curM) $('#fMonth').value = curM;
  fillWarn();
}
function fillWarn() {
  const cur = $('#fWarn').value || 'ALL';
  $('#fWarn').innerHTML = `<option value="ALL">${tt('all')}</option>` + Object.keys(ST).map(k => `<option value="${k}">${ST[k][lang === 'vi' ? 0 : 1]}</option>`).join('');
  $('#fWarn').value = cur;
}
function setLang(l) {
  lang = l; $('#lvi').classList.toggle('on', l === 'vi'); $('#len').classList.toggle('on', l === 'en');
  fillFilters(); render();
}
function enter(raw, msg) {
  DB = normalize(raw); $('#login').hidden = true; $('#app').hidden = false;
  $('#status').textContent = msg; fillFilters(); render();
}

/* ============ DỮ LIỆU MẪU ============ */
function demoData() {
  const U = (y, m, d) => Date.UTC(y, m - 1, d);
  const mk = (code, name, line, life) => ({ 'Item Code_QAD': code, 'TÊN HH-Vnsese Description': name, 'EA Qty #1 (CT)': 1, 'EA Qty #2 (Pack)': 10, 'EA Qty #3 (Cn)': 40, 'Product Line': line, 'Useful Life(Month': life });

             oh('South', '110301470001', 'BiteeZ', U(2026,1,15), U(2026,10,15), 500), oh('North', '110301480001', 'Yappy VN', U(2026,3,1), U(2027,3,1), 250)],

/* ============ TẢI DỮ LIỆU THẬT ============ */
const cache = {};
async function readXlsx(folder, file) {
  const path = `${folder}/${file}`;
  if (cache[path]) return cache[path];
  const { data, error } = await sb.storage.from(CFG.bucket).download(path);
  if (error) throw new Error(path + ': ' + error.message);
  const wb = XLSX.read(await data.arrayBuffer(), { type: 'array', cellDates: true });
  return (cache[path] = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: null }));
}

async function loadReal() {
  $('#loginErr').textContent = tt('loading');
  const { data: list, error } = await sb.storage.from(CFG.bucket).list('', { limit: 1000 });
  if (error) throw new Error('Không lấy được danh sách thư mục: ' + error.message);

  // Thư mục dạng DD.MM.YYYY của năm báo cáo
  const fs = (list || []).map(i => {
    const m = i.name.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
    return m && +m[3] === CFG.year ? { name: i.name, d: +m[1], m: +m[2] } : null;
  }).filter(Boolean);

  const base = fs.filter(f => f.m === CFG.months[0]).sort((a, b) => b.d - a.d)[0];   // ngày lớn nhất của tháng gốc
  const latest = [...fs].sort((a, b) => (b.m - a.m) || (b.d - a.d))[0];               // thư mục mới nhất (cho QAD)
  if (!base) throw new Error(`Không có thư mục dữ liệu tháng ${CFG.months[0]}/${CFG.year}`);

  const [master, onhand, transit] = await Promise.all(
    ['master', 'onhand', 'transit'].map(k => readXlsx(base.name, CFG.files[k])));
  const qad = await readXlsx(latest.name, CFG.files.qad);

  const res = await fetch(CFG.planUrl);
  if (!res.ok) throw new Error('Apps Script trả về lỗi ' + res.status);
  const j = await res.json();
  enter({ master, onhand, transit, qad, plan: j['Sales plan'] || [], unit: j['unit'] || [] },
        `${tt('loaded')} (onhand/transit: ${base.name} · QAD: ${latest.name})`);
}

async function login() {
  $('#loginErr').textContent = '';
  try {
    sb = sb || supabase.createClient(CFG.url, CFG.key);
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    if (error) throw error;
    await loadReal();                                  // lỗi sẽ hiện ở #loginErr vì #app còn đang ẩn
  } catch (e) { $('#loginErr').textContent = tt('lerr') + (e.message || e); }
}

/* ============ SỰ KIỆN ============ */
$('#btnLogin').onclick = login;
$('#pw').onkeydown = e => { if (e.key === 'Enter') login(); };
$('#btnDemo').onclick = () => enter(demoData(), tt('demo'));
$('#btnOut').onclick = async () => { try { await sb?.auth.signOut(); } catch (e) {} location.reload(); };
$('#lvi').onclick = () => setLang('vi'); $('#len').onclick = () => setLang('en');

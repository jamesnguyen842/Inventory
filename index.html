<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Báo cáo tổng hợp tồn kho</title>
<style>
:root{--bg:#f5f6f4;--fg:#1c2421;--mut:#66706b;--card:#fff;--line:#d9dedb;--ac:#1f6f5c;--ac2:#e8f1ee}
@media(prefers-color-scheme:dark){:root{--bg:#141917;--fg:#e6ebe8;--mut:#93a09a;--card:#1d2421;--line:#2f3a35;--ac:#4fb59b;--ac2:#22302b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:6px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#login{max-width:340px;margin:12vh auto;background:var(--card);border:1px solid var(--line);padding:28px;border-radius:10px;display:grid;gap:12px}
#login h2{margin:0 0 4px}
input,select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);width:100%}
.err{color:#b3261e;min-height:1.2em}
header{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:22px;margin:0;flex:1}
.data-selector {display:flex;gap:8px;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center;background:var(--ac2)}
.filters{display:flex;gap:16px;padding:14px 24px;flex-wrap:wrap}
.filters label{display:grid;gap:3px;min-width:170px;color:var(--mut);font-size:12px}
.tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 16px}
.tabs button.on{border-bottom-color:var(--ac);background:none;color:var(--ac);font-weight:600}
main{padding:16px 24px}

.wrap{overflow-x:auto;overflow-y:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px;background:var(--card)}

table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--ac2);position:sticky;top:0;z-index:2}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.neg{color:#b3261e;font-weight:600}
.b{padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid;display:inline-block}
.ok{color:#1e7a4a;background:#e3f4ea;border-color:#b7e0c6}
.wt{color:#7a6a12;background:#f8f1cf;border-color:#e6d98b}
.nr{color:#96570f;background:#fbe9d0;border-color:#efc78f}
.dp{color:#a2400c;background:#f9d9c6;border-color:#eba57f}
.ex{color:#a3201a;background:#f8d7d4;border-color:#e59b95}
.note{color:var(--mut);margin:0 0 10px}
.empty{padding:28px;text-align:center;color:var(--mut)}
/* CSS Bảng HSD & MT */
.hsd-30 { background-color: #C65911; color: white; text-align: center; font-weight: bold; }
.hsd-50 { background-color: #F4B084; text-align: center; font-weight: bold; }
.hsd-60 { background-color: #FFFF00; text-align: center; font-weight: bold; }
.hsd-70 { background-color: #A9D08E; text-align: center; font-weight: bold; }
.hsd-gt70 { background-color: #548235; color: white; text-align: center; font-weight: bold; }
.text-center { text-align: center !important; }
</style>
</head>
<body>

<div id="login">
  <h2>Đăng nhập</h2>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button class="pri" id="btnLogin">Đăng nhập</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" hidden>
  <header>
    <h1 id="ttl"></h1>
    <button id="lvi" class="on">Vi</button><button id="len">En</button>
    <button id="btnOut"></button>
  </header>
  
  <div class="data-selector">
    <span style="font-weight:600;margin-right:8px" data-t="selDate"></span>
    <div id="folder-container" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <button id="btnAddFolder" type="button" title="Thêm ngày">+</button>
    <button id="btnLoadData" class="pri" data-t="loadData"></button>
    <span id="dataStatus" style="font-size:13px;color:var(--mut);margin-left:8px"></span>
  </div>

  <div class="filters">
    <label><span data-t="year"></span><select id="fYear"></select></label>
    <label><span data-t="month"></span><select id="fMonth"></select></label>
    <label><span data-t="loc"></span><select id="fLoc"></select></label>
    <label><span data-t="line"></span><select id="fLine"></select></label>
    <label><span data-t="prod"></span><input type="text" id="fProd" placeholder="Gõ tên SP..."></label>
    <label><span data-t="warn"></span><select id="fWarn"></select></label>
  </div>
  
  <div class="tabs">
    <button data-tab="sum" class="on"></button>
    <button data-tab="det"></button>
    <button data-tab="mt"></button>
    <button data-tab="inv"></button>
    <button data-tab="logic"></button>
  </div>
  <main><div id="view"></div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============ CẤU HÌNH ============ */
const CFG = {
  url: 'https://didthuazwmuxddlxhkob.supabase.co',
  key: 'sb_publishable_qDGjgGQ06a5w8_DM903-UQ_cMEuI-lw',
  bucket: 'inventory',
  files: { master:'master.xlsx', onhand:'onhand.xlsx', qad:'qad.xlsx', transit:'transit.xlsx' },
  planUrl: 'https://script.google.com/macros/s/AKfycbyqGQoY8K6mCNxNq_sUjlzN-PdgH-DqnfKG-J15XGHAi2eJcIlQqtT5iszbaE0Sg7pLoQ/exec',
  year: 2026, months: [9,10,11,12],
  baseNoPlanUseQad: false
};

let CURRENT_YEAR = CFG.year;
let ALL_FOLDERS = [];
let SELECTED_FOLDERS = [];
let LOGIC_RULES = []; 

/* ============ ĐA NGÔN NGỮ ============ */
const T = {
 vi:{ttl:'Báo cáo tổng hợp tồn kho',selDate:'Chọn ngày:',loadData:'Xác nhận tải',year:'Năm báo cáo',line:'Lọc ngành hàng',prod:'Lọc tên sản phẩm',month:'Tháng báo cáo',warn:'Cảnh báo',all:'Tất cả',
  sum:'Form sum',det:'Form detail', mt:'Follow MT', inv:'Current Inventory', logic:'Logic',
  out:'Đăng xuất',loc:'Kho',sku:'SKU',prodT:'Sản phẩm',lineC:'Ngành',begin:'Tồn đầu kỳ',tr:'In transit',so:'Sell out',end:'Tồn cuối kỳ',cov:'Coverday',
  st:'Trạng thái',lot:'Trạng thái lô',skuSt:'Trạng thái SKU',mnf:'NSX',exp:'HSD',hsd:'% HSD',qty:'Tồn cuối lô',empty:'Không có dữ liệu',
  mon:'Tháng',cond:'Điều kiện logic',risk:'Chi Tiết Rủi Ro',act:'Hành Động',note:'Ghi chú',wait:'Xin chờ trong giây lát...',reqErr:'Vui lòng chọn ít nhất 1 ngày!',dupErr:'Không được chọn nhiều ngày trong cùng 1 tháng!',loaded:'Đã tải dữ liệu thành công!',
  loadingFolders:'Đang lấy danh sách ngày...',lerr:'Đăng nhập thất bại: ',est:'HSD ước tính',
  nSum:'- Bằng 0 nếu ngày chọn là ngày cuối tháng, ngược lại lấy Selling Plan', nDet:''},
 en:{ttl:'Inventory Summary Report',selDate:'Select date:',loadData:'Load Data',year:'Report year',line:'Filter line',prod:'Filter product name',month:'Report month',warn:'Warning',all:'All',
  sum:'Form sum',det:'Form detail', mt:'Follow MT', inv:'Current Inventory', logic:'Logic',
  out:'Log out',loc:'Warehouse',sku:'SKU',prodT:'Product',lineC:'Line',begin:'Opening stock',tr:'In transit',so:'Sell out',end:'Ending inventory',cov:'Coverday',
  st:'Status',lot:'Status lot',skuSt:'SKU status',mnf:'MNF',exp:'EXP',hsd:'% Shelf-life',qty:'Lot ending',empty:'No data',
  mon:'Month',cond:'Logic Condition',risk:'Risk Details',act:'Action',note:'Note',wait:'Please wait...',reqErr:'Please select at least 1 date!',dupErr:'Cannot select multiple dates in same month!',loaded:'Data loaded successfully!',
  loadingFolders:'Fetching dates...',lerr:'Login failed: ',est:'Estimated EXP',
  nSum:'- 0 if end of month, else Selling Plan', nDet:''}
};

const ST = {
 SAFE:['An toàn','Safe','ok', 'Không', 'Duy trì kế hoạch bán hàng', 'None', 'Maintain sales plan'],
 WATCH:['Theo dõi (50–65%)','Watch (50–65%)','wt', 'Rủi ro Cận date', 'Tăng cường kế hoạch', 'Risk of Near Expiry', 'Increase sales plan'],
 NEAR:['Cận date (<50%)','Near (<50%)','nr', 'Rủi ro hủy hàng', 'Chạy CTKM', 'Risk of disposal', 'Run promotion'],
 DISPOSE:['Hủy hàng (<30%)','Dispose (<30%)','dp', 'Rủi ro hủy hàng', 'CTKM xả tồn', 'Risk of disposal', 'Big promotion'],
 EXPIRED:['Hết hạn SD','Expired','ex', 'Hàng hết HSD', 'Cách ly chờ hủy', 'Expired batch', 'Isolate for disposal'],
 SHORT:['Thiếu hàng','Out of stock','ex', 'Thiếu hàng thực tế', 'Lên PO', 'Actual shortage', 'Issue PO'],
 SHORT_MT:['Thiếu kênh MT','MT shortage','dp', 'Thiếu hàng thực tế', 'Đẩy giao hàng', 'Actual shortage', 'Accelerate delivery'],
 BELOW:['Dưới an toàn','Below safety','nr', 'Rất dễ thiếu hàng', 'Đẩy giao hàng', 'High risk of shortage', 'Accelerate delivery'],
 OVER:['Vượt nhu cầu','Over demand','wt', 'Rủi ro tồn đọng', 'Tăng kế hoạch', 'Risk of stagnation', 'Increase sales plan'],
 EMPTY:['Đã xuất hết','Out of batch','ok', 'Không', 'Duy trì', 'None', 'Maintain']
};

/* ============ TIỆN ÍCH ============ */
const $= s => document.querySelector(s),$$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n == null ? '—' : (Math.round(n * 10) / 10).toLocaleString('en-US');
const MN = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
let lang = 'vi', sb = null, DB = null, tab = 'sum';

const pick = (r, re) => { 
  if (!r) return undefined;
  const k = Object.keys(r).find(k => re.test(String(k).trim().replace(/\s+/g, ' '))); 
  return k ? r[k] : undefined; 
};

const day = ms => Math.floor(ms / 864e5) * 864e5;
const addMonths = (ms, n) => { const d = new Date(ms); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, d.getUTCDate()); };

/* XỬ LÝ LÀM SẠCH NGÀY THÁNG ĐỒNG BỘ */
function parseExcelDate(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : Date.UTC(v.getFullYear(), v.getMonth(), v.getDate());
  if (typeof v === 'number') return v > 1e10 ? day(v) : day(Math.round((v - 25569) * 864e5));
  
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3]);
  
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) {
    let y = +m[3] < 100 ? 2000 + +m[3] : +m[3];
    if (+m[1] > 12) return Date.UTC(y, +m[2] - 1, +m[1]);
    return Date.UTC(y, +m[1] - 1, +m[2]);
  }
  
  m = s.match(/^(\d{1,2})[\/\-.\s]([a-zA-Z]{3})(?:[\/\-.\s](\d{2,4}))?$/);
  if (m) {
    const monthStr = m[2].toLowerCase(), monthIdx = MN.findIndex(mn => monthStr.startsWith(mn));
    if (monthIdx >= 0) { const yr = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : CURRENT_YEAR; return Date.UTC(yr, monthIdx, +m[1]); }
  }
  const t = Date.parse(s); return isNaN(t) ? null : day(t);
}

const monthOf = ms => new Date(ms).getUTCMonth() + 1;
function parseMonth(v) {
  if (v instanceof Date || (typeof v === 'number' && v > 100)) { const t = parseExcelDate(v); return t ? monthOf(t) : null; }
  const s = String(v ?? '').trim().toLowerCase(), i = MN.findIndex(m => s.startsWith(m));
  return i >= 0 ? i + 1 : (+s.replace(/\D/g, '') || null);
}

function normLoc(v) {
  const s = String(v ?? '').trim().toLowerCase();
  if (s === '11001' || s === 'hcmc' || s === 'south') return 'South';
  if (s === '15001' || s === 'hanoi' || s === 'north') return 'North';
  return String(v ?? '').trim();
}
const cleanSku = v => String(v ?? '').trim().replace(/-01$/, '');
const skipSku = s => { if (!s) return true; const up = String(s).toUpperCase(); return up.startsWith('CKCT') || up.startsWith('MD') || up.startsWith('QD'); };

/* ============ CHUẨN HÓA DỮ LIỆU THÔ ============ */
function normalize(raw) {
  const master = new Map();
  raw.master.forEach(r => {
    const code = cleanSku(pick(r, /item.*code|sku/i)); if (!code) return;
    master.set(code, {
      name: String(pick(r, /^(tên hh|ten hh|description)/i) ?? '').trim(),
      line: 'Snack', life: +pick(r, /useful life/i) || 0,
      ea: { 1: +pick(r, /^ea qty #1/i) || 1, 2: +pick(r, /^ea qty #2/i) || 1, 3: +pick(r, /^ea qty #3/i) || 1 }
    });
  });

  const skuList = Array.isArray(raw.sku) ? raw.sku : [];
  skuList.forEach(r => {
    const code = cleanSku(pick(r, /item number|sku/i)); if (!code) return;
    const name = String(pick(r, /^(tên|name|desc|product)/i) || Object.values(r)[1] || '').trim();
    if (master.has(code)) { if (name) master.get(code).name = name; } 
    else master.set(code, { name, line: 'Snack', life: 0, ea: {1:1,2:1,3:1} });
  });

  const unitMap = {};
  (raw.unit || []).forEach(r => { unitMap[String(pick(r, /^(unit|đơn vị|mã)/i) ?? Object.values(r)[0]).trim()] = String(pick(r, /ea qty type/i) ?? ''); });
  const eaLevel = u => { const t = unitMap[u] || ''; return /3|cn|can/i.test(t) ? 3 : /2|pack/i.test(t) ? 2 : 1; };

  const custypeMap = {};
  (raw.custype || []).forEach(r => {
    const keys = Object.keys(r);
    if (keys.length >= 2) {
      const qadType = String(r[keys[0]]).trim().toUpperCase();
      const planCustomer = String(r[keys[1]]).trim();
      if (qadType) {
        custypeMap[qadType] = planCustomer;
      }
    }
  });

  const G = new Map();
  const grp = (loc, sku) => {
    const k = loc + '|' + sku;
    if (!G.has(k)) G.set(k, { loc, sku, line: 'Snack', oh: [], tr: [], plan: {}, mtPlan: {}, qad: {}, mtQad: {}, planDetails: [], qadByCus: {}, mtTransactions: [] });
    return G.get(k);
  };
  const life = s => master.get(s)?.life || 0;

  raw.onhand.forEach(r => {
    const sku = cleanSku(r['SKU_Code'] ?? r['SKU Code'] ?? pick(r, /sku/i));
    const loc = normLoc(r['Location'] ?? pick(r, /location|kho/i));
    const qty = +(r['Q.ty On-Hand'] ?? r['Qty On-Hand'] ?? r['Qty On Hand'] ?? pick(r, /qty|on.*hand|tồn/i)) || 0;
    
    if (skipSku(sku) || !qty) return;

    const g = grp(loc, sku);
    if (!g.fallbackName) g.fallbackName = String(r['Sort Name'] ?? pick(r, /sort.*name|tên/i) ?? '').trim();
    const exp = parseExcelDate(r['Expiry Date'] ?? r['ExpiryDate'] ?? pick(r, /expiry|exp|hsd/i));
    let mnf = parseExcelDate(r['MNF Date'] ?? r['MNFDate'] ?? pick(r, /mnf|mfg|nsx/i));
    if (!mnf && exp && life(sku)) mnf = addMonths(exp, -life(sku));
    g.oh.push({ exp, mnf, qty, est: false });
  });

  raw.transit.forEach(r => {
    const sku = cleanSku(r['Item Code_QAD'] ?? pick(r, /item.*code|sku/i));
    const loc = normLoc(r['Location'] ?? pick(r, /location|kho/i));
    const qty = +(r['In transit_Qty'] ?? pick(r, /transit|số lượng|qty/i)) || 0;
    const eta = parseExcelDate(r['ETA_Date'] ?? pick(r, /eta/i));
    if (skipSku(sku) || !qty || !eta) return;
    const g = grp(loc, sku); let exp = parseExcelDate(r['Expiry_Date'] ?? pick(r, /expiry|exp/i)), est = false;
    if (!exp && life(sku)) { exp = addMonths(eta, life(sku)); est = true; }
    const mnf = exp && life(sku) ? addMonths(exp, -life(sku)) : null;
    g.tr.push({ exp, mnf, qty, est, m: monthOf(eta) });
  });

  const plans = Array.isArray(raw.plan) ? raw.plan : (raw.plan?.salesplan || raw.plan?.data || []);
  plans.forEach(r => {
    const sku = cleanSku(r['SKU_Code'] ?? pick(r, /sku/i));
    const m = parseMonth(r['Month'] ?? pick(r, /month|tháng/i));
    const q = +(r['Sell Plan'] ?? pick(r, /sell.*plan|plan/i)) || 0;
    if (skipSku(sku) || !m) return;
    const g = grp(normLoc(r['Warehouse'] ?? pick(r, /warehouse|kho/i)), sku);
    g.plan[m] = (g.plan[m] || 0) + q;
    
    const chnl = String(r['Channel'] ?? pick(r, /channel|kênh/i) ?? '').trim();
    if (/^mt$/i.test(chnl)) g.mtPlan[m] = (g.mtPlan[m] || 0) + q;
    
    g.planDetails.push({
        m: m,
        channel: chnl,
        customer: String(r['Customers'] ?? pick(r, /customer|khách/i) ?? '').trim(),
        start: parseExcelDate(r['Starting date'] ?? pick(r, /start|bắt/i)),
        end: parseExcelDate(r['Ending date'] ?? pick(r, /end|kết/i)),
        plan: q
    });
  });

  raw.qad.forEach(r => {
    const sku = cleanSku(r['Item Number'] ?? pick(r, /item.*number|mã/i));
    const t = parseExcelDate(r['Invoice Date'] ?? pick(r, /invoice.*date|ngày/i));
    const q = +(r['Qty Invoiced'] ?? pick(r, /qty.*invoiced|số lượng/i)) || 0;
    if (skipSku(sku) || !t) return;
    
    const m = master.get(sku), u = String(r['Unit of Measure'] ?? pick(r, /unit|đơn vị/i) ?? '').trim();
    const ctn = m ? q / (m.ea[eaLevel(u)] || 1) : q;
    const mo = monthOf(t);
    const loc = normLoc(r['HQ'] ?? pick(r, /hq|kho/i));
    const g = grp(loc, sku);
    
    g.qad[mo] = (g.qad[mo] || 0) + ctn;
    
    const keyCus = String(r['Key Cus'] ?? r['Customer Name'] ?? r['Customer'] ?? pick(r, /key.*cus|khách|customer/i) ?? '').trim();
    const chnlQad = String(r['Channel'] ?? pick(r, /channel|kênh/i) ?? '').trim();
    const cusType = String(r['Customer Type'] ?? pick(r, /customer.*type|loại/i) ?? '').trim();
    
    if (keyCus.toUpperCase() !== 'TT') {
      const mappedPlanCustomer = custypeMap[cusType.toUpperCase()];
      const finalCus = mappedPlanCustomer || keyCus; 
      
      g.qadByCus[mo] = g.qadByCus[mo] || {};
      g.qadByCus[mo][finalCus] = (g.qadByCus[mo][finalCus] || 0) + ctn;
      
      g.mtTransactions.push({
          date: t, 
          customer: finalCus,
          qty: ctn
      });
    }
    
    if (/^mt$/i.test(keyCus) || /^mt$/i.test(chnlQad)) g.mtQad[mo] = (g.mtQad[mo] || 0) + ctn;
  });

  G.forEach(g => { 
    const m = master.get(g.sku); 
    g.name = (m && m.name) ? m.name : (g.fallbackName || g.sku);
    g.life = m ? m.life : 0; 
  });
  
  return [...G.values()].filter(g => /mix|biteez|parteez|yappy/i.test(String(g.name)));
}

/* ============ TÍNH TOÁN ============ */
const remain = (plan, qad, m) => plan[m] != null ? (qad[m] != null ? Math.max(plan[m] - qad[m], 0) : plan[m]) : (qad[m] || 0);
const sum = a => a.reduce((s, x) => s + x.qty, 0);
function lotStatus(h) { return h == null ? '' : h <= 0 ? 'EXPIRED' : h < 30 ? 'DISPOSE' : h < 50 ? 'NEAR' : h < 65 ? 'WATCH' : 'SAFE'; }

function compute(M, lineFilter, nameFilterStr, locFilter) {
  const end = Date.UTC(CURRENT_YEAR, M, 0), days = new Date(end).getUTCDate(), out = [];
  const nameRe = nameFilterStr ? new RegExp(nameFilterStr, 'i') : null;
  const lineRe = lineFilter && lineFilter !== 'ALL' ? new RegExp(lineFilter, 'i') : null;
  const locRe = locFilter && locFilter !== 'ALL' ? new RegExp('^' + locFilter + '$', 'i') : null;

  const sortedSelected = [...SELECTED_FOLDERS].sort((a, b) => (a.y - b.y) || (a.m - b.m) || (a.d - b.d));
  const baseMonth = sortedSelected.length > 0 ? sortedSelected[0].m : CFG.months[0];
  const calcMonths = CFG.months.filter(m => m >= baseMonth && m <= M);

  DB.forEach(g => {
    if (locRe && !locRe.test(String(g.loc || ''))) return;
    if (lineRe && !lineRe.test(String(g.name || ''))) return;
    if (nameRe && !nameRe.test(String(g.name || ''))) return;
    
    let lots = g.oh.map(l => ({ ...l })), deficit = 0, R = null;
    const latestFolder = sortedSelected.length > 0 ? sortedSelected[sortedSelected.length - 1] : null;
    
    calcMonths.forEach(m => {
      const begin = sum(lots) - deficit, inn = g.tr.filter(t => t.m === m);
      inn.forEach(t => lots.push({ ...t }));
      lots.sort((a, b) => (a.exp ?? 9e15) - (b.exp ?? 9e15));                  
      
      let so = 0;
      const eomMonth = SELECTED_FOLDERS.find(f => f.m === m && f.isEOM && f.y === CURRENT_YEAR);
      if (eomMonth) {
          so = 0; 
      } else if (latestFolder && m > latestFolder.m) {
          so = g.plan[m] || 0;
      } else {
          so = (m === baseMonth && g.plan[m] == null && !CFG.baseNoPlanUseQad) ? 0 : remain(g.plan, g.qad, m);
      }

      let rem = so + deficit;
      for (const l of lots) { if (rem <= 0) break; const t = Math.min(l.qty, rem); l.qty -= t; rem -= t; }
      deficit = rem;
      R = { begin, tr: sum(inn), so, ending: sum(lots) - deficit };
    });
    
    if (!R) return;

    const isFutureM = latestFolder && M > latestFolder.m;
    const mtDem = isFutureM ? (g.mtPlan[M] || 0) : remain(g.mtPlan, g.mtQad, M);
    
    const totalDem = R.so;
    const dl = lots.filter(l => l.qty > 0).map(l => {
      const h = l.exp && l.mnf && l.exp > l.mnf ? (l.exp - end) / (l.exp - l.mnf) * 100 : null;
      return { ...l, h, st: lotStatus(h) };
    });
    const mtQual = dl.filter(l => l.h != null && l.h >= 60).reduce((s, l) => s + l.qty, 0);
    const limit = g.plan[M] > 0 && g.life ? g.plan[M] * 0.3 * g.life : null;
    let sku = '';
    if (R.ending < 0) sku = 'SHORT';
    else if (R.ending >= totalDem && mtQual < mtDem) sku = 'SHORT_MT';
    else if (R.so > 0 && R.ending < R.so / days * 14) sku = 'BELOW';
    else if (limit != null && R.ending > limit) sku = 'OVER';
    
    const isReportingMonthEOM = SELECTED_FOLDERS.some(f => f.m === M && f.isEOM && f.y === CURRENT_YEAR);
    const covDem = isReportingMonthEOM ? (g.qad[M] || 0) : (g.plan[M] || 0);
    const cov = R.ending < 0 ? 0 : (covDem > 0 ? (R.ending / covDem) * days : null);
    
    out.push({ ...R, g, days, cov, sku, lots: dl, mtQual, mtDem });
  });
  return out.sort((a, b) => (a.g.loc + a.g.sku).localeCompare(b.g.loc + b.g.sku));
}

const tt = k => T[lang][k] || k;
const badge = c => c && ST[c] ? `<span class="b ${ST[c][2]}">${esc(ST[c][lang === 'vi' ? 0 : 1])}</span>` : '—';
const th = (...k) => `<tr>${k.map(x => `<th>${esc(tt(x))}</th>`).join('')}</tr>`;
const num = (v, neg) => `<td class="n ${neg && v < 0 ? 'neg' : ''}">${fmt(v)}</td>`;

function passWarn(w, skuSt, lotSts) {
  if (w === 'ALL') return true;
  return skuSt === w || lotSts.includes(w) || (w === 'SAFE' && !skuSt && lotSts.every(s => s === 'SAFE'));
}
let lastFilterKey = '';
let cachedRows = [];

  if (!DB) return;
  const w = $('#fWarn').value, M = +$('#fMonth').value;

  if (lastFilterKey !== currentFilterKey) {
    cachedRows = compute(M, lv, nv, locv);
    lastFilterKey = currentFilterKey;
  }
  const rows = cachedRows;
  
  let h = '';
  if (tab === 'sum') {
    let tBegin = 0, tTr = 0, tSo = 0, tEnd = 0;
    const body = rows.filter(r => passWarn(w, r.sku, r.lots.map(l => l.st))).map(r => {
      tBegin += r.begin; tTr += r.tr; tSo += r.so; tEnd += r.ending;
      const worst = r.lots.length ? r.lots.reduce((a, b) => (b.h ?? 1e9) < (a.h ?? 1e9) ? b : a).st : '';
      const stKey = r.sku || worst || 'EMPTY';

      tQty += l.qty;
      const stKey = l.st || 'EMPTY';
      const risk = ST[stKey]?.[lang === 'vi' ? 3 : 5] || '';
      const act = ST[stKey]?.[lang === 'vi' ? 4 : 6] || '';
      const d = x => x ? new Date(x).toISOString().slice(0, 10) : '—';
      body += `<tr><td>${esc(r.g.loc)}</td><td>${esc(r.g.sku)}</td><td>${esc(r.g.name)}</td><td>${d(l.mnf)}</td><td>${d(l.exp)}${l.est ? ' *' : ''}</td>${num(l.qty)}<td class="n">${l.h == null ? '—' : fmt(l.h) + '%'}</td><td>${badge(l.st)}</td><td>${badge(r.sku)}</td><td style="white-space:normal;min-width:180px">${esc(risk)}</td><td style="white-space:normal;min-width:220px">${esc(act).replace(/\n/g,'<br>')}</td></tr>`;

    };

    rows.forEach(r => {
        const plansForMonth = (r.g.planDetails || []).filter(p => p.m === M);
        
        if (plansForMonth.length > 0) {
            plansForMonth.forEach(p => {
                // ẨN NHỮNG KHÁCH HÀNG CÓ TÊN LÀ "TT"

                let actualCus = 0;
                if (p.start && p.end) {
                    actualCus = (r.g.mtTransactions || [])

    h = `<div class="wrap"><table>
        <tr>
            <th>Warehouse</th>
            <th>Product (SKU - Name)</th>
            <th>Customer Name</th>
            <th class="text-center">Starting date</th>
            <th class="text-center">Ending date</th>
            <th class="n">Sale Plan</th>
            <th class="n">Actual</th>
            <th class="n">Remaining</th>
        </tr>
        ${body || `<tr><td colspan="8" class="empty">${tt('empty')}</td></tr>`}
    </table></div>`;
  } 

  else if (tab === 'inv') {
    let body = '';
    rows.forEach(r => {
      if(r.ending > 0) {
        let b30 = 0, b50 = 0, b60 = 0, b70 = 0, bgt70 = 0;
        r.lots.forEach(l => {
            if(l.h == null) return;
            if(l.h < 30) b30 += l.qty;
            else if(l.h < 50) b50 += l.qty;
            else if(l.h < 60) b60 += l.qty;
            else if(l.h <= 70) b70 += l.qty;
            else bgt70 += l.qty;
        });

        if((b30+b50+b60+b70+bgt70) > 0) {
            body += `<tr>
                <td>${esc(r.g.loc)}</td>
                <td>${esc(r.g.sku)}</td>
                <td>${esc(r.g.name)}</td>
                <td class="n">${b30 > 0 ? fmt(b30) : ''}</td>
                <td class="n">${b50 > 0 ? fmt(b50) : ''}</td>
                <td class="n">${b60 > 0 ? fmt(b60) : ''}</td>
                <td class="n">${b70 > 0 ? fmt(b70) : ''}</td>
                <td class="n">${bgt70 > 0 ? fmt(bgt70) : ''}</td>
            </tr>`;
        }
      }
    });

    h = `<div class="wrap"><table>
        <tr>
            <th rowspan="2" style="vertical-align:bottom">Warehouse</th>
            <th rowspan="2" style="vertical-align:bottom">Product Code</th>
            <th rowspan="2" style="vertical-align:bottom">Product Name</th>
            <th class="hsd-30">&lt;30%</th>
            <th class="hsd-50">30-50%</th>
            <th class="hsd-60">50-60%</th>
            <th class="hsd-70">60-70%</th>
            <th class="hsd-gt70">&gt;70%</th>
        </tr>
        <tr>
            <th class="text-center hsd-30">Tháng ${M}</th>
            <th class="text-center hsd-50">Tháng ${M}</th>
            <th class="text-center hsd-60">Tháng ${M}</th>
            <th class="text-center hsd-70">Tháng ${M}</th>
            <th class="text-center hsd-gt70">Tháng ${M}</th>
        </tr>
        ${body || `<tr><td colspan="8" class="empty">${tt('empty')}</td></tr>`}
    </table></div>`;
  }
  
  else {
    let noteHTML = `
      <div class="note" style="margin-top:16px; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:8px; line-height:1.6; color:var(--fg)">
        <strong style="display:block; margin-bottom:8px;">Về trường hợp Tồn kho thực tế (on hand) lệch so với Tồn cuối kỳ trước:</strong>
        <ul style="margin:0; padding-left:20px;">
          <li style="margin-bottom:6px;"><strong>Trong thực tế vận hành:</strong> Sự chênh lệch này thường do các nguyên nhân như hao hụt, hàng hỏng/vỡ, xuất/nhập nhầm, hoặc độ trễ trong việc ghi nhận lên hệ thống ERP (QAD). Đội ngũ kho và chuỗi cung ứng cần kiểm kê lại (Cycle Count hoặc Physical Count) để tìm nguyên nhân và thực hiện bút toán điều chỉnh (Inventory Adjustment) trên QAD.</li>
          <li><strong>Trong công cụ báo cáo này:</strong> File on hand được xem là nguồn sự thật tuyệt đối (Source of Truth) tại thời điểm báo cáo. Hệ thống sẽ luôn lấy số liệu Tồn kho thực tế trong on hand làm Tồn Đầu Kỳ (Opening Stock) của kỳ tính toán hiện tại, bất kể kỳ trước hệ thống tính toán ra lý thuyết là bao nhiêu. Điều này đảm bảo kế hoạch bán hàng và cảnh báo HSD luôn được tính trên số hàng thực sự đang nằm trong kho.</li>
        </ul>
      </div>`;

    if (LOGIC_RULES && LOGIC_RULES.length > 0) {
        const keys = Object.keys(LOGIC_RULES[0]);
        h = `<div class="wrap"><table>
            <tr>${keys.map(k => `<th>${esc(k)}</th>`).join('')}</tr>
            ${LOGIC_RULES.map(r => `<tr>${keys.map((k, i) => {
                let val = r[k];
                if (i === 0 && ST[val]) return `<td>${badge(val)}</td>`;
                return `<td style="white-space:normal;min-width:180px">${esc(val).replace(/\n/g,'<br>')}</td>`;
            }).join('')}</tr>`).join('')}

    } else {
        h = `<div class="empty">${tt('empty')} (Chưa có dữ liệu từ bảng Logic)</div>` + noteHTML;
    }
  }
  
  $('#view').innerHTML = h;
}

const cache = {};
async function readXlsx(folder, file) {
  const path = `${folder}/${file}`;
  if (cache[path]) return cache[path];
  const { data, error } = await sb.storage.from(CFG.bucket).download(path);
  if (error) throw new Error(path + ': ' + error.message);
  const wb = XLSX.read(await data.arrayBuffer(), { type: 'array', cellDates: true });
  return (cache[path] = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: null }));
}

async function login() {
  $('#loginErr').textContent = '';
  try {
    sb = sb || supabase.createClient(CFG.url, CFG.key);
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    if (error) throw error;
    
    $('#login').hidden = true; 
    $('#app').hidden = false;
    setLang(lang);
    $('#dataStatus').textContent = tt('loadingFolders');
    $('#view').innerHTML = `<div class="empty">${tt('empty')}</div>`;

    const { data: list, err } = await sb.storage.from(CFG.bucket).list('', { limit: 1000 });
    if (err) throw new Error('Không lấy được danh sách: ' + err.message);

    ALL_FOLDERS = (list || []).map(i => {
      const m = i.name.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
      if (m) {
        const d = +m[1], mo = +m[2], y = +m[3];
        return { name: i.name, d, m: mo, y, isEOM: d === new Date(y, mo, 0).getDate() };
      }
      return null;
    }).filter(Boolean).sort((a, b) => b.y - a.y || b.m - a.m || b.d - a.d);

    $('#dataStatus').textContent = '';
    addFolderSelect(); 
  } catch (e) { $('#loginErr').textContent = tt('lerr') + (e.message || e); }
}

function addFolderSelect() {
  const sel = document.createElement('select');
  sel.className = 'folder-sel';
  sel.innerHTML = '<option value="">-- Chọn ngày --</option>' + ALL_FOLDERS.map(f => `<option value="${f.name}">${f.name}</option>`).join('');
  $('#folder-container').appendChild(sel); }  async function confirmLoadData() { const sels = $$('.folder-sel').map(s => s.value).filter(Boolean);
  if (!sels.length) return alert(tt('reqErr'));
  
  const selected = sels.map(name => ALL_FOLDERS.find(f => f.name === name));
  
  const monthKeys = selected.map(f => `${f.m}-${f.y}`);
  if (new Set(monthKeys).size !== monthKeys.length) return alert(tt('dupErr'));
  
  SELECTED_FOLDERS = selected;
  $('#dataStatus').textContent = tt('wait');
  
  try {
    const sorted = [...selected].sort((a, b) => a.y - b.y || a.m - b.m || a.d - b.d);
    const base = sorted[0]; 
    const latest = sorted[sorted.length - 1]; 
    
    const res = await fetch(CFG.planUrl, { redirect: 'follow' });
    if (res.ok) {
      const j = await res.json();
      cache['api_plan'] = j['Sales plan'] || []; 
      cache['api_unit'] = j['unit'] || []; 
      cache['api_sku'] = j['sku'] || [];
      cache['api_custype'] = j['custype'] || []; 
      cache['api_logic'] = j['Logic'] || []; 
    }
    
    LOGIC_RULES = cache['api_logic'] || [];

    const [master, onhand, transit] = await Promise.all(['master', 'onhand', 'transit'].map(k => readXlsx(base.name, CFG.files[k]).catch(()=>[])));
    
    const latestQad = await readXlsx(latest.name, CFG.files.qad).catch(()=>[]);
    let allQadData = [...latestQad];
    
    const presentMonths = new Set();
    latestQad.forEach(r => {
        const t = parseExcelDate(r['Invoice Date'] ?? pick(r, /invoice.*date|ngày/i));
        if (t) {
            const d = new Date(t);
            presentMonths.add(`${d.getUTCMonth()+1}-${d.getUTCFullYear()}`);
        }
    });

    const neededMonths = new Set();
    (cache['api_plan'] || []).forEach(p => {
        const sd = parseExcelDate(p['Starting date'] ?? pick(p, /start|bắt/i));
        const ed = parseExcelDate(p['Ending date'] ?? pick(p, /end|kết/i));
        if (sd) { const d = new Date(sd); neededMonths.add(`${d.getUTCMonth()+1}-${d.getUTCFullYear()}`); }
        if (ed) { const d = new Date(ed); neededMonths.add(`${d.getUTCMonth()+1}-${d.getUTCFullYear()}`); }
    });

    const extraPromises = [];
    for (const mKey of neededMonths) {
        if (!presentMonths.has(mKey)) {
            const [mStr, yStr] = mKey.split('-');
            const m = +mStr, y = +yStr;
            const folder = ALL_FOLDERS.find(f => f.m === m && f.y === y && f.isEOM) || ALL_FOLDERS.find(f => f.m === m && f.y === y);
            if (folder) {
                presentMonths.add(mKey); 
                extraPromises.push(readXlsx(folder.name, CFG.files.qad).catch(()=>[]));
            }
        }
    }
    
    if (extraPromises.length > 0) {
        const extraQads = await Promise.all(extraPromises);
        extraQads.forEach(eq => allQadData = allQadData.concat(eq));
    }
    
    const years = [...new Set(selected.map(f => f.y))].sort((a,b)=>b-a);
    $('#fYear').innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
    CURRENT_YEAR = years[0] || CFG.year;
    
    DB = normalize({ 
        master, onhand, transit, qad: allQadData, 
        plan: cache['api_plan'] || [], 
        unit: cache['api_unit'] || [], 
        sku: cache['api_sku'] || [],
        custype: cache['api_custype'] || []
    });
    
    $('#dataStatus').textContent = tt('loaded');
    
    fillFilters(); render();
  } catch (e) {
    $('#dataStatus').textContent = 'Lỗi: ' + e.message;
  }
}

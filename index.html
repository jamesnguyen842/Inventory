<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Cấu hình CSP để bảo mật XSS theo yêu cầu D6 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.sheetjs.com; connect-src 'self' https://didthuazwmuxddlxhkob.supabase.co https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline';">
  <title>Báo cáo tổng hợp tồn kho</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <style>
    :root { --primary: #0056b3; --bg: #f4f6f9; --text: #333; --border: #ccc; }
    body { font-family: Arial, sans-serif; margin: 0; background-color: var(--bg); color: var(--text); }
    .hidden { display: none !important; }
    
    /* Login Screen */
    #login-screen { display: flex; height: 100vh; justify-content: center; align-items: center; }
    .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
    .login-box input { width: 100%; margin-bottom: 15px; padding: 10px; box-sizing: border-box; }
    .login-box button { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; }
    
    /* Main Dashboard */
    #app-screen { display: flex; flex-direction: column; height: 100vh; }
    header { background: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .lang-toggle button { margin-left: 5px; cursor: pointer; }
    
    /* Filters */
    .filters { padding: 15px 20px; background: white; display: flex; gap: 15px; border-bottom: 1px solid var(--border); }
    .filters select { padding: 8px; border-radius: 4px; border: 1px solid var(--border); }
    
    /* Tabs */
    .tabs { display: flex; background: #e9ecef; padding: 0 20px; }
    .tab-btn { padding: 10px 20px; border: none; background: transparent; cursor: pointer; font-weight: bold; border-bottom: 3px solid transparent; }
    .tab-btn.active { border-bottom-color: var(--primary); color: var(--primary); }
    
    /* Content & Tables */
    .content { padding: 20px; flex: 1; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border: 1px solid var(--border); padding: 8px; text-align: left; font-size: 14px; }
    th { background: #f8f9fa; position: sticky; top: 0; }
    
    /* Warning Colors */
    .warn-red { background-color: #ffeeba; color: #dc3545; font-weight: bold; }
    .warn-orange-dark { background-color: #ffe8a1; color: #fd7e14; }
    .warn-orange-light { background-color: #fff3cd; color: #ffc107; }
    .warn-green { color: #28a745; }
    
    #dq-alert { color: red; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Màn hình đăng nhập -->
  <div id="login-screen">
    <div class="login-box">
      <h2 id="lbl-login-title">Đăng nhập hệ thống</h2>
      <input type="email" id="auth-email" placeholder="Email" />
      <input type="password" id="auth-password" placeholder="Password" />
      <button id="btn-login">Đăng nhập</button>
      <div id="login-error" style="color:red; margin-top:10px; font-size: 14px;"></div>
    </div>
  </div>

  <!-- Giao diện chính -->
  <div id="app-screen" class="hidden">
    <header>
      <h2 id="lbl-app-title">Báo cáo tổng hợp tồn kho</h2>
      <div style="display: flex; align-items: center; gap: 20px;">
        <div id="dq-alert" class="hidden" title="Nhấn để xem chi tiết lỗi dữ liệu">⚠️ Lỗi dữ liệu (<span id="dq-count">0</span>)</div>
        <div class="lang-toggle">
          <button onclick="setLang('vi')">[Vi]</button>
          <button onclick="setLang('en')">[En]</button>
        </div>
        <button id="btn-logout" style="padding: 5px 10px;">Đăng xuất</button>
      </div>
    </header>

    <div class="filters">
      <!-- Bộ lọc 1: Ngành hàng -->
      <select id="filter-product-line">
        <option value="all">Tất cả ngành hàng</option>
        <option value="mix">MIX</option>
        <option value="biteez">BiteeZ</option>
        <option value="yappy">Yappy</option>
        <option value="parteez">ParteeZ</option>
      </select>
      
      <!-- Bộ lọc 2: Tháng báo cáo -->
      <select id="filter-month">
        <option value="9">Tháng 9 (September)</option>
        <option value="10">Tháng 10 (October)</option>
        <option value="11">Tháng 11 (November)</option>
        <option value="12">Tháng 12 (December)</option>
      </select>

      <!-- Bộ lọc 3: Cảnh báo -->
      <select id="filter-warning">
        <option value="all">Tất cả cảnh báo</option>
        <option value="SAFE">An toàn</option>
        <option value="NEAR_DATE">Cận date (<50% HSD)</option>
        <option value="DISCARD">Hủy hàng (<30% HSD)</option>
        <option value="EXPIRED">Hết hạn SD</option>
        <option value="SHORTAGE">Thiếu hàng</option>
        <option value="BELOW_SAFETY">Dưới an toàn</option>
        <option value="MT_SHORT">Thiếu hàng kênh MT</option>
      </select>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-sum">Form sum</button>
      <button class="tab-btn" data-tab="tab-detail">Form detail</button>
      <button class="tab-btn" data-tab="tab-logic">Logic</button>
    </div>

    <div class="content">
      <div id="tab-sum" class="tab-content">
        <table id="tbl-sum">
          <thead><tr><th>Kho</th><th>SKU</th><th>Tên SP</th><th>Tồn đầu</th><th>In Transit</th><th>Sell Out</th><th>Ending SKU</th><th>Cảnh báo</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      
      <div id="tab-detail" class="tab-content hidden">
        <table id="tbl-detail">
          <thead><tr><th>Kho</th><th>SKU</th><th>Ngày MNF</th><th>Ngày EXP</th><th>% HSD</th><th>Tồn cuối lô</th><th>Cảnh báo lô</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div id="tab-logic" class="tab-content hidden">
        <table id="tbl-logic">
          <thead><tr><th>Cảnh báo</th><th>Điều Kiện Logic</th><th>Rủi ro thực tế</th><th>Hành Động</th></tr></thead>
          <tbody id="tbody-logic"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // 1. Cấu hình Supabase & Hằng số
    const supabase = createClient('https://didthuazwmuxddlxhkob.supabase.co', 'sb_publishable_qDGjgGQ06a5w8_DM903-UQ_cMEuI-lw');
    const PLAN_URL = 'https://script.google.com/macros/s/AKfycbxO9zT33UapiEpEoCgRGQXr6uexQ-WIToK74iS_pXVMob_zA7Fw81l8AtpX1tZvRrOZuw/exec';
    
    const DAY = 86400000;
    const EPS = 1e-6;
    const WARNING_LABELS = {
      SOLD_OUT: 'Đã xuất hết', EXPIRED: 'Hết hạn SD', SHORTAGE: 'Thiếu hàng',
      MT_SHORT: 'Thiếu hàng kênh MT', DISCARD: 'Hủy hàng', NEAR_DATE: 'Cận date',
      BELOW_SAFETY: 'Dưới an toàn', OVERSTOCK: 'Vượt nhu cầu', SAFE: 'An toàn', UNCLASSIFIED: 'Chưa phân loại'
    };
    const THRESHOLDS = { DISCARD_MIN: 10, DISCARD_MAX: 30, NEAR_MAX: 50, SAFE_MIN: 65, MT_MIN: 60, SAFETY_DAYS: 14 };

    // Bộ thu thập lỗi chất lượng dữ liệu
    const dq = {
      items: [],
      add(code, value, ctx) { this.items.push({ code, value, ctx }); this.updateUI(); },
      clear() { this.items.length = 0; this.updateUI(); },
      updateUI() {
        const el = document.getElementById('dq-alert');
        if (this.items.length > 0) {
          el.classList.remove('hidden');
          document.getElementById('dq-count').textContent = this.items.length;
        } else {
          el.classList.add('hidden');
        }
      }
    };

    // 2. Logic Đa ngôn ngữ (Localization)
    const DICT = {
      'vi': { title: 'Báo cáo tổng hợp tồn kho', login: 'Đăng nhập hệ thống' },
      'en': { title: 'Inventory Summary Report', login: 'System Login' }
    };
    window.setLang = (lang) => {
      document.getElementById('lbl-app-title').textContent = DICT[lang].title;
      document.getElementById('lbl-login-title').textContent = DICT[lang].login;
    };

    // 3. Hàm Tiện ích & Chuẩn hóa
    const round3 = (x) => Math.round(x * 1000) / 1000;
    const normKey = (v) => (v == null ? '' : String(v)).trim().toUpperCase();
    
    // Ánh xạ mã kho (Location Mapping)
    const LOCATION_MAP = { '11001': 'South', '15001': 'North', 'SOUTH': 'South', 'NORTH': 'North', 'HCMC': 'South', 'HANOI': 'North' };
    function normLocation(v, ctx) {
      const r = LOCATION_MAP[normKey(v)];
      if (!r) { dq.add('LOCATION_UNKNOWN', normKey(v), ctx); return null; }
      return r;
    }

    // Xử lý mã QAD (Loại bỏ hậu tố -01)
    function processQADItemNumber(itemNum) {
      const code = normKey(itemNum);
      if (code.startsWith('CKCT') || code.startsWith('MD') || code.startsWith('QD')) return null;
      return code.endsWith('-01') ? code.slice(0, -3) : code;
    }

    // Chuẩn hóa ngày Excel sang UTC
    function parseExcelDate(v) {
      if (!v) return null;
      if (v instanceof Date) return new Date(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate()));
      if (typeof v === 'number' && v > 0 && v <= 80000) return new Date(Date.UTC(1899, 11, 30) + Math.floor(v) * DAY);
      return null;
    }
    const isoDay = (d) => (d ? d.toISOString().slice(0, 10) : 'N/A');

    // Tạo Element an toàn chống XSS
    function createCell(tr, text, cssClass = '') {
      const td = document.createElement('td');
      td.textContent = text; // Sử dụng textContent để chống XSS
      if (cssClass) td.className = cssClass;
      tr.appendChild(td);
    }

    // 4. Thuật toán Lõi (FIFO & Cảnh báo)
    function cmpExp(a, b) {
      const x = a ? +a : Infinity, y = b ? +b : Infinity;
      return x === y ? 0 : (x < y ? -1 : 1);
    }

    // Thuật toán FIFO trừ lùi Sell out
    function allocateFIFO(lots, sellOut) {
      const sorted = [...lots].sort((a, b) => cmpExp(a.exp, b.exp) || (a.sku < b.sku ? -1 : 1));
      let remaining = Math.max(0, sellOut);
      for (const l of sorted) {
        const take = remaining > EPS ? Math.min(l.qty, remaining) : 0;
        l.endQty = round3(l.qty - take);
        remaining = round3(remaining - take);
      }
      return { lots: sorted, unmet: remaining };
    }

    // Cây điều kiện logic cảnh báo
    function evaluateWarning(c) {
      const T = THRESHOLDS;
      const hasPct = c.pct !== null;
      if (c.endQty <= EPS) return 'SOLD_OUT';
      if (hasPct && c.pct <= 0) return 'EXPIRED';
      if (c.skuClosing < 0) return 'SHORTAGE';
      if (c.skuAvailable >= c.totalDemand && c.mtQualified < c.mtDemand) return 'MT_SHORT';
      if (hasPct && c.pct >= T.DISCARD_MIN && c.pct < T.DISCARD_MAX) return 'DISCARD';
      if (hasPct && c.pct >= T.DISCARD_MAX && c.pct < T.NEAR_MAX) return 'NEAR_DATE';
      if (c.coverDays !== null && c.coverDays < T.SAFETY_DAYS) return 'BELOW_SAFETY';
      if (hasPct && c.pct >= T.SAFE_MIN) return 'SAFE';
      return 'UNCLASSIFIED';
    }

    // 5. Xác thực và Quản lý UI
    const uiLogin = document.getElementById('login-screen');
    const uiApp = document.getElementById('app-screen');

    supabase.auth.onAuthStateChange((event, session) => {
      if (session) {
        uiLogin.classList.add('hidden');
        uiApp.classList.remove('hidden');
        // Ở kịch bản thực tế, gọi hàm tải file từ storage qua hàm loadAll() ở đây.
        // loadAll().then(processData).catch(e => alert(e.message));
        renderLogicTabMock(); // Mock dữ liệu bảng Logic theo yêu cầu không dùng eval
      } else {
        uiLogin.classList.remove('hidden');
        uiApp.classList.add('hidden');
      }
    });

    document.getElementById('btn-login').addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) document.getElementById('login-error').textContent = error.message;
    });

    document.getElementById('btn-logout').addEventListener('click', async () => {
      await supabase.auth.signOut();
    });

    // Xử lý chuyển Tab
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        e.target.classList.add('active');
        document.getElementById(e.target.dataset.tab).classList.remove('hidden');
      });
    });

    // Hàm render bảng Logic cứng (Không gọi eval)
    function renderLogicTabMock() {
      const tbody = document.getElementById('tbody-logic');
      tbody.innerHTML = '';
      const rules = [
        { warn: 'Đã xuất hết', logic: 'Tồn kho lô = 0', risk: 'Không', action: 'Duy trì kế hoạch FIFO' },
        { warn: 'Hết hạn SD', logic: '%HSD <= 0', risk: 'Không lưu thông', action: 'Cách ly, tiêu hủy' },
        { warn: 'Thiếu hàng', logic: 'Tồn tổng < 0', risk: 'Thiếu hàng thực tế', action: 'Lên PO đặt hàng' }
      ];
      rules.forEach(r => {
        const tr = document.createElement('tr');
        createCell(tr, r.warn); createCell(tr, r.logic); createCell(tr, r.risk); createCell(tr, r.action);
        tbody.appendChild(tr);
      });
    }

  </script>
</body>
</html>
